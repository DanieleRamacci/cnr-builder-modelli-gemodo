# Matrice di copertura - collega requisiti, scenari e contratti a una spec owner
# (spec 009, User Story 3, FR-016; entita' MatriceCopertura in
# backend/app/quality/schemas.py, regole in backend/app/quality/coverage.py).
#
# scenario_id usa gli id degli scenari end-to-end minimi (E2E-001..E2E-006,
# specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml) oppure,
# per i requisiti trasversali non legati a un flusso GEBAN, gli scenari di readiness
# gia' numerati in specs/009-fondamenta-mock-test-qualita/quickstart.md
# (SCENARIO-1..SCENARIO-10).
#
# stato: DA_COPRIRE | COPERTO | BLOCCATO (allowed_status del contratto readiness).
# COPERTO significa verificato da un test o da un manifest reale in questa sessione;
# DA_COPRIRE significa che l'implementazione runtime appartiene a una spec che non ha
# ancora tasks.md proprio (vedi AGENTS.md).

