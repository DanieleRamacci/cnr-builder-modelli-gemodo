      Keycloak autentica utenti/client, firma JWT, issuer, audience e ruoli/claim
      generali; GEMODO valida il JWT lato backend e applica autorizzazioni applicative.
      Per la 001 le API operative devono gia' validare JWT Bearer, audience
      gemodo-backend, client tecnico geban-backend per chiamate GEBAN e ruoli
      DOCUMENTI_GENERATORE/DOCUMENTI_VIEWER. Le autorizzazioni fini su profili di
      integrazione, oggetti documentali, builder, generazione e audit completo restano
      responsabilita' della 006 e delle spec collegate.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-31

  - id: DEC-001-PROFILO-GEBAN
    titolo: Profilo GEBAN versionato e mappatura campi concordata
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/003-sezioni-placeholder-versionamento
      - specs/004-generazione-documenti-pdf
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: il catalogo applica un enforcement esplicito per profilo
      di integrazione (DEC-001-RELAZIONE-PROFILO-CATALOGO) dentro le route gia'
      esistenti, senza nuovi endpoint dedicati (DEC-001-API-PROFILO-GEBAN); i contratti
      dati ammessi vivono in un registro multi-tenant scoped per tipo documento
      (DEC-001-REGISTRO-CONTRATTI-DATI), la cui proprieta' appartiene all'Ufficio che
      possiede quel tipo documento, distinto dall'Applicazione che lo consuma
      (DEC-001-UFFICIO-PROPRIETARIO). Il profilo/contratto di ogni sistema richiedente
      resta un file versionato nel repo, che popola vere tabelle DB (non solo cache di
      processo), aggiornato solo via build+deploy (DEC-001-CONFIG-PROFILO-GEBAN).
      Rischio residuo: design puntuale (schema tabelle, migration, nuovi codici errore)
      ancora da completare in plan.md; nessuna implementazione presente, il catalogo
      oggi non impedisce ancora l'uso di modelli fuori dal profilo GEBAN.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-CONFIG-PROFILO-GEBAN
    titolo: Configurazione del profilo GEBAN
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14 col product owner: il profilo/contratto di ogni sistema
      richiedente (GEBAN e futuri altri) resta un file versionato nel repository, non
      un dato gestito a runtime dal builder. Non serve pubblicazione live: ogni
      aggiornamento richiede commit, build immagine e deploy. Il file diventa il seed
      iniziale che popola vere tabelle Postgres per profili/uffici/tipi documento
      ammessi (stesso pattern gia' usato per il catalogo, migration 0005-0007), non
      solo un valore cachato in memoria di processo (_load_sistemi_richiedenti_cached
      in backend/app/common/security.py); un futuro punto di modifica (es. interfaccia
      web) scrivera' sulle stesse tabelle, senza richiedere un cambio di schema in quel
      momento. Questo risolve il rischio di staleness della lru_cache, spostando la
      fonte di verita' a runtime dal file cachato al DB. Rischio residuo: schema esatto
      delle tabelle, migration di caricamento e modifica di security.py per leggere dal
      DB ancora da progettare in plan.md.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-UFFICIO-PROPRIETARIO
    titolo: Distinzione Ufficio (proprietario) da Applicazione (consumatore)
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/003-sezioni-placeholder-versionamento
      - specs/007-frontend-builder-consultazione
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: un Ufficio (nuova entita') possiede uno o piu' Tipo
      Documento e autora categorie/tipologie/contratti dati/modelli per quelli che
      possiede; un'Applicazione (ProfiloDiIntegrazione, es. GEBAN) e' autorizzata a
      consumare (consultare/generare) uno o piu' Tipo Documento indipendentemente da
      quale Ufficio li possiede — lo stesso profilo GEBAN potra' essere autorizzato
      anche a un futuro tipo documento come GRADUATORIA_CONCORSO, posseduto da un
      Ufficio diverso da quello di BANDO_CONCORSO. Sostituisce l'ipotesi precedente di
      un flag tipo_integrazione: APPLICAZIONE|UFFICIO su ProfiloDiIntegrazione, che
      mescolava i due concetti in un'unica entita'. Per il primo incremento GEBAN non
      cambia nulla in pratica (GEMODO agisce per conto di un Ufficio "Reclutamento"
      implicito via file di config), ma TipoDocumento deve gia' avere un riferimento a
      un Ufficio proprietario (FR-031) per non richiedere un redesign quando arrivera'
      un secondo ufficio/tipo documento reale. Rischio residuo: schema esatto (tabella
      Ufficio, FK su tipo_documento) ancora da completare in plan.md.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-GENERALIZZAZIONE-TIPOLOGIA
    titolo: Generalizzazione di TipologiaBandoSOL a TipologiaDocumento
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14, su richiesta esplicita del product owner di generalizzare
      subito invece che dopo con piu' codice sopra: la tabella tipologia_bando_sol
      (oggi globale, codice univoco nell'intero sistema, con codice_sol obbligatorio
      legato solo all'integrazione GEBAN-SOL) diventa tipologia_documento, scoped per
      tipo_documento_id (come gia' categoria_documento), con un riferimento_esterno
      opzionale invece che un codice_sol obbligatorio. Il parametro pubblico
      codice_tipologia e il codice errore TIPOLOGIA_SOL_NON_VALIDA restano invariati
      per non rompere il contratto OpenAPI gia' pubblicato. Rimossa anche la colonna
      tipo_documento.tipologia_bando_sol_id (verificato: non letta/scritta da nessun
      codice reale, vestigiale). Rischio residuo: richiede una migration Alembic di
      rename tabella/colonne (non modificare le migration storiche 0003/0005/0006) e
      l'aggiornamento di backend/app/catalog/models.py, repository.py, service.py, dei
      test e di infra/local/postgres/seed-demo-catalog.yaml (chiave tipologie_sol ->
      tipologie, ogni voce guadagna tipo_documento) — ancora da completare in plan.md.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-IDENTIFICATIVI-MODELLO
    titolo: Identificativi e mapping modello GEBAN-GEMODO
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/001-catalogo-contratto-geban
    stato: SOSPESA
    assunzione_provvisoria: >
      GEBAN riceve da GEMODO la lista dei modelli validi alla data, sceglie
      modello/versione, conserva la versione scelta e la reinvia con i dati
      obbligatori. Il piano 001 (aggiornato 2026-07-29) procede con
      modello_versione_id come intero (int64), coerente col contratto OpenAPI gia'
      pubblicato: nessun requisito esplicito richiede oggi un cambio breaking verso un
      identificativo stringa. Gli identificativi stringa nei manifest demo 009 (es.
      demo-bando-concorso-standard-v1) restano etichette leggibili nei manifest di
      qualita', non il formato dell'API.
    impatto: >
      contratto API della 001 (specs/001-catalogo-contratto-geban/contracts/geban-catalog-api.openapi.yaml,
      v0.2.0); rischio residuo: se GEBAN richiedera' un identificativo stringa, sara'
      un cambio breaking sul contratto pubblicato, da coordinare come nuova versione
      major dell'OpenAPI, non una modifica silenziosa.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-29

  - id: DEC-001-RELAZIONE-PROFILO-CATALOGO
    titolo: Relazione tra profilo GEBAN e catalogo GEMODO
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: le API catalogo/validazione devono risolvere il profilo di
      integrazione attivo del chiamante (oggi disponibile in PrincipalGEMODO/client_id
      ma scartato dalle route con `_: PrincipalGEMODO`, vedi
      backend/app/catalog/api.py) e verificare che tipo documento, categoria, tipologia
      e modello_versione_id richiesti siano ammessi dal profilo (categorie_ammessi,
      tipologie_ammessi, modelli_versioni_ammessi gia' modellati su
      ProfiloDiIntegrazione). La risposta deve distinguere esplicitamente "fuori dal
      perimetro contrattuale del chiamante" (errore funzionale, codice
      PROFILO_INTEGRAZIONE_NON_ABILITATO) da "nel perimetro ma senza ancora un modello pubblicato"
      (elenco vuoto, comportamento gia' esistente e mantenuto invariato per quel caso).
      Rischio residuo tracciato: il catalogo oggi non applica ancora questa
      distinzione (vedi DEC-006-AUTORIZZAZIONI-PROFILO-GEBAN); resta da progettare in
      plan.md il punto esatto di enforcement (dependency FastAPI dedicata vs logica nel
      service layer), prima di implementare filtri per profilo o builder di profili.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-API-PROFILO-GEBAN
    titolo: API specifiche per profilo GEBAN
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/006-sicurezza-autorizzazioni-audit
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: l'enforcement per profilo viene applicato dentro le route
      catalogo/validazione gia' esistenti; non si introducono endpoint dedicati al
      profilo GEBAN. Resta pero' un cambio del contratto OpenAPI della 001, perche'
      introduce nuovi codici errore funzionali (distinzione fuori-perimetro vs nel
      perimetro senza modello) da documentare esplicitamente, non un'estensione
      silenziosa. Rischio residuo: il contratto OpenAPI pubblicato
      (specs/001-catalogo-contratto-geban/contracts/geban-catalog-api.openapi.yaml) va
      aggiornato in modo coordinato con GEBAN quando i nuovi codici errore vengono
      introdotti in implementazione.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-REGISTRO-CONTRATTI-DATI
    titolo: Registro multi-tenant dei contratti dati per tipo documento
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: `contratti_dati_ammessi` su ProfiloDiIntegrazione (es.
      "bando-concorso-common-fields-v1" in infra/local/integration-profiles.local.yaml)
      e' oggi solo una stringa senza nessuna definizione a supporto: nessun file,
      tabella o validazione la risolve. Si introduce un registro dei contratti dati,
      scoped per Tipo Documento (proprieta' ereditata transitivamente dall'Ufficio che
      possiede quel tipo documento — vedi DEC-001-UFFICIO-PROPRIETARIO — non dal
      sistema richiedente/profilo che lo consuma); ogni contratto dati del registro
      definisce l'insieme di campi (stessa forma di Campo Richiesto/campo_modello:
      codice, etichetta, tipo, obbligatorieta', lingua) che un modello di quel tipo
      documento puo' dichiarare. Il builder (002/003, non ancora implementato) dovra'
      vincolare la creazione di campi modello ai contratti dati ammessi per il tipo
      documento in cui il modello viene creato. Bloccante per 002/003: senza questo
      registro il builder non ha modo di limitare cosa un gestore puo' inserire in un
      modello per un dato tipo documento. Rischio residuo: da progettare in plan.md
      schema esatto dell'entita', dove
      persiste (file YAML versionato come il resto del catalogo seed, coerente con
      DEC-001-CONFIG-PROFILO-GEBAN, oppure tabella DB), e come il builder la applica.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-006-AUTORIZZAZIONI-PROFILO-GEBAN
    titolo: Autorizzazioni del profilo GEBAN
    owner_spec: specs/006-sicurezza-autorizzazioni-audit
    spec_interessate:
      - specs/001-catalogo-contratto-geban
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: la parte ruoli/claim/audience/client e' implementata dalla
      006 (JWT, aud=gemodo-backend, client geban-backend/geri-angular-public, ruoli
      diretti e ruoli ACE mappati via role_mappings — vedi
      backend/app/common/security.py). Resta pero' NON collegata al perimetro
      catalogo/modelli: la funzione is_operazione_autorizzata() e le liste
      categorie_ammessi/tipologie_ammessi/modelli_versioni_ammessi di
      ProfiloDiIntegrazione oggi hanno un solo chiamante in tutto il repo,
      backend/tests/support/fake_gemodo_client.py (un fixture di test), non le route
      reali. Qualunque chiamante con ruolo DOCUMENTI_VIEWER/DOCUMENTI_GENERATORE puo'
      oggi interrogare categorie/tipologie/modelli di qualunque profilo, non solo del
      proprio. La direzione per chiudere questo collegamento e' definita in
      DEC-001-RELAZIONE-PROFILO-CATALOGO (ora confermata). Rischio residuo: da
      implementare prima di andare in produzione con generazione reale per GEBAN —
      senza questo collegamento un futuro secondo sistema richiedente potrebbe
      leggere/generare documenti di proprieta' di GEBAN (o viceversa) usando solo un
      JWT con ruolo applicativo valido.
    fase_bloccante: IMPLEMENTAZIONE
    data_ultima_revisione: 2026-09-14

