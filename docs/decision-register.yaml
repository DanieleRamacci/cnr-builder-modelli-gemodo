      i campi complessi esposti dalla 001 verso GEBAN usano schema JSON strutturato con
      sotto-campi, tipi, obbligatorieta', ordine e vincoli per array/object. GEBAN invia
      dati strutturati, non testo preformattato; formattazione visuale e impaginazione
      restano responsabilita' del modello documentale e del renderer PDF nelle spec
      successive.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-07-31

