    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: il catalogo applica un enforcement esplicito per profilo
      di integrazione (DEC-001-RELAZIONE-PROFILO-CATALOGO) dentro le route gia'
      esistenti, senza nuovi endpoint dedicati (DEC-001-API-PROFILO-GEBAN); i contratti
      dati ammessi vivono in un registro multi-tenant scoped per tipo documento
      (DEC-001-REGISTRO-CONTRATTI-DATI), la cui proprieta' appartiene al contesto
      (codice_contesto) che possiede quel tipo documento, distinto dall'Applicazione
      che lo consuma (2026-09-15: DEC-001-CONTESTO-SOSTITUISCE-UFFICIO supersede
      DEC-001-UFFICIO-PROPRIETARIO qui citata, stesso principio). Il profilo/contratto di ogni sistema richiedente
      resta un file versionato nel repo, che popola vere tabelle DB (non solo cache di
      processo), aggiornato solo via build+deploy (DEC-001-CONFIG-PROFILO-GEBAN).
      Rischio residuo: design puntuale (schema tabelle, migration, nuovi codici errore)
      ancora da completare in plan.md; nessuna implementazione presente, il catalogo
      oggi non impedisce ancora l'uso di modelli fuori dal profilo GEBAN.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-09-14

  - id: DEC-001-CONFIG-PROFILO-GEBAN
    titolo: Configurazione del profilo GEBAN
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14 col product owner: il profilo/contratto di ogni sistema
      richiedente (GEBAN e futuri altri) resta un file versionato nel repository, non
      un dato gestito a runtime dal builder. Non serve pubblicazione live: ogni
      aggiornamento richiede commit, build immagine e deploy. Il file diventa il seed
      iniziale che popola vere tabelle Postgres per profili/uffici/tipi documento
      ammessi (stesso pattern gia' usato per il catalogo, migration 0005-0007), non
      solo un valore cachato in memoria di processo (_load_sistemi_richiedenti_cached
      in backend/app/common/security.py); un futuro punto di modifica (es. interfaccia
      web) scrivera' sulle stesse tabelle, senza richiedere un cambio di schema in quel
      momento. Questo risolve il rischio di staleness della lru_cache, spostando la
      fonte di verita' a runtime dal file cachato al DB. Rischio residuo: schema esatto
      delle tabelle, migration di caricamento e modifica di security.py per leggere dal
      DB ancora da progettare in plan.md.
      Nota 2026-09-15 (ADR 0001): superata sul punto "file versionato, non
      un'interfaccia self-service" — il product owner ha confermato di volere
      un'interfaccia di amministrazione gia' in questo incremento, anche per GEBAN
      (vedi DEC-001-ONBOARDING-STRUTTURA-DOCUMENTO). Resta valido il resto: tabelle
      Postgres come fonte di verita' a runtime, nessun auto-provisioning da token
      con contesto sconosciuto.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-14

  - id: DEC-002-GESTORE-UFFICIO-MAPPING
    titolo: Come si risolve l'Ufficio del gestore modelli chiamante
    owner_spec: specs/002-builder-modelli
    spec_interessate:
      - specs/001-catalogo-contratto-geban
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14 col product owner: nessun meccanismo GEMODO separato
      (login o gruppo Keycloak dedicato ai gestori). Il gestore modelli arriva dallo
      stesso token ACE/contesto gia' costruito per il consumo GEBAN
      (contexts.<app>.roles, backend/app/common/security.py): chi ha ROLE_MANAGER#geban
      (gia' mappato oggi a GEMODO_MODELLI_GESTORE in role_mappings) e' il gestore.
      SUPERSEDUTA in parte da DEC-001-CONTESTO-SOSTITUISCE-UFFICIO (2026-09-15): il
      "campo esplicito ufficio: per voce di role_mappings" descritto qui sotto non va
      piu' implementato - il token_context gia' presente su ogni voce di role_mappings
      e' di per se' il segnale sufficiente, senza un'etichetta Ufficio aggiuntiva da
      derivarne. Il meccanismo di base (gestore risolto dal contesto/ruolo del token,
      nessuna interfaccia self-service separata) resta valido e non cambia.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-15

  - id: DEC-002-SORGENTE-UFFICIO-TOKEN
    titolo: Sorgente del segnale Ufficio nel token del gestore (claim diretto vs. inferenza da contesto)
    owner_spec: specs/002-builder-modelli
    spec_interessate:
      - specs/001-catalogo-contratto-geban
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-15 dal product owner, risolve definitivamente lo scenario
      aperto: niente claim di afferenza/ufficio dedicato (scenario A scartato) e
      niente inferenza implicita di un'etichetta Ufficio dal contesto (scenario B
      originale, anch'esso scartato in favore di qualcosa di piu' semplice). Il
      "contesto" del token (contexts.<nome>.roles, meccanismo gia' implementato in
      backend/app/common/security.py per GEBAN) E' l'unita' di scoping, senza livelli
      aggiuntivi sopra: un utente puo' avere piu' contesti nel token (es. "geban" e
      "contratti"), ciascuno con i propri ruoli; vede/gestisce i documenti di TUTTI i
      tipi documento il cui codice_contesto e' fra i contesti presenti nel suo token
      (unione, non intersezione). Per ora nessuna associazione piu' fine (quale ruolo
      dentro un contesto autorizza cosa oltre a quanto gia' derivato da role_mappings)
      - rimandata a quando servira' davvero. Vedi DEC-001-CONTESTO-SOSTITUISCE-UFFICIO
      per l'impatto sullo schema dati (TipoDocumento.codice_contesto sostituisce
      l'idea di un'entita' Ufficio separata) e sull'enforcement (l'autorizzazione per
      un tipo documento specifico va risolta guardando SOLO il contesto corrispondente
      nel token, non la lista di permessi gia' appiattita su tutti i contesti insieme
      - altrimenti un utente con contesto "geban" che da' GESTORE e contesto
      "contratti" che da' solo VIEWER risulterebbe erroneamente GESTORE anche su
      Contratti).
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-15

  - id: DEC-001-UFFICIO-PROPRIETARIO
    titolo: Distinzione Ufficio (proprietario) da Applicazione (consumatore)
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/003-sezioni-placeholder-versionamento
      - specs/007-frontend-builder-consultazione
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-14: un Ufficio (nuova entita') possiede uno o piu' Tipo
      Documento e autora categorie/tipologie/contratti dati/modelli per quelli che
      possiede; un'Applicazione (ProfiloDiIntegrazione, es. GEBAN) e' autorizzata a
      consumare (consultare/generare) uno o piu' Tipo Documento indipendentemente da
      quale Ufficio li possiede. SUPERSEDUTA da DEC-001-CONTESTO-SOSTITUISCE-UFFICIO
      (2026-09-15): l'entita' Ufficio separata non si costruisce piu' - il ruolo che
      doveva giocare (chi puo' scrivere su quale tipo documento) e' giocato dal
      contesto del token (gia' esistente), tramite TipoDocumento.codice_contesto.
      La distinzione concettuale Ufficio (proprietario/autore)/Applicazione
      (consumatore) resta valida - e' solo l'implementazione di "proprietario" che
      cambia da entita' dedicata a campo diretto sul contesto.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-15

  - id: DEC-001-CONTESTO-SOSTITUISCE-UFFICIO
    titolo: Il contesto del token sostituisce l'entita' Ufficio come meccanismo di ownership/scoping
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/003-sezioni-placeholder-versionamento
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/007-frontend-builder-consultazione
      - specs/009-fondamenta-mock-test-qualita
      - specs/010-configurazione-cataloghi-integrazioni
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-15 dal product owner. Sostituisce (supersede) sia
      DEC-001-UFFICIO-PROPRIETARIO sia la parte di DEC-002-GESTORE-UFFICIO-MAPPING
      relativa al campo ufficio: su role_mappings. Nessuna entita'/tabella Ufficio:
      TipoDocumento porta un campo diretto codice_contesto (stringa) che deve
      corrispondere a una chiave contexts.<codice_contesto> nel token di chi vuole
      leggere/scrivere i suoi documenti o modelli. L'autorizzazione per un'operazione
      su un tipo documento specifico si risolve cosi': (1) il token del chiamante
      contiene una chiave contexts.<X> dove X == tipo_documento.codice_contesto? Se
      no, rifiutato (stesso comportamento funzionale di prima, errore esplicito, non
      lista vuota). (2) dentro SOLO quel contesto, quali internal_permissions
      derivano i ruoli esterni presenti, via role_mappings (meccanismo gia'
      implementato in permessi_da_ruoli_esterni, backend/app/quality/
      integration_profile.py) - la permission richiesta (es. GEMODO_MODELLI_GESTORE
      per una scrittura, DOCUMENTI_VIEWER/DOCUMENTI_GENERATORE per una lettura) deve
      essere fra quelle derivate DA QUEL CONTESTO, non dall'unione appiattita di tutti
      i contesti del token (correttezza multi-contesto, vedi nota in
      DEC-002-SORGENTE-UFFICIO-TOKEN). Un utente con piu' contesti nel token (es.
      "geban" e "contratti") vede/gestisce l'unione dei tipi documento associati a
      ciascun contesto che possiede, ciascuno verificato separatamente - mai
      permission bleed fra contesti diversi. Per ora GEMODO_MODELLI_GESTORE via
      contexts.geban.roles=ROLE_MANAGER#geban resta l'unico caso reale configurato
      (BANDO_CONCORSO, un solo contesto); il meccanismo e' gia' generale per quando
      arrivera' un secondo contesto/tipo documento reale (es. "contratti").
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-15

