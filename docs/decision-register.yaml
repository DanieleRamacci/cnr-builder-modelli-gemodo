    impatto: >
      ogni modifica admin concordata con GEBAN a campi, vincoli o placeholder collegati
      crea una nuova versione del contratto/modello; le versioni precedenti restano
      storiche e sono usabili operativamente solo finche' restano pubblicate e valide.
      Se una versione precedente viene archiviata o sospesa, GEBAN deve ricaricare
      catalogo/campi e selezionare una versione valida.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-07-31

