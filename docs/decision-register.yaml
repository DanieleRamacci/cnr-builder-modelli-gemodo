  - id: DEC-006-CONFINE-KEYCLOAK-GEMODO
    titolo: Confine Keycloak/GEMODO nelle autorizzazioni applicative
    owner_spec: specs/006-sicurezza-autorizzazioni-audit
    spec_interessate:
      - specs/001-catalogo-contratto-geban
      - specs/002-builder-modelli
      - specs/007-frontend-builder-consultazione
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      Keycloak autentica utenti/client, firma JWT, issuer, audience e ruoli/claim
      generali; GEMODO valida il JWT lato backend e applica autorizzazioni applicative.
      Per la 001 le API operative devono gia' validare JWT Bearer, audience
      gemodo-backend, client tecnico geban-backend per chiamate GEBAN e ruoli
      DOCUMENTI_GENERATORE/DOCUMENTI_VIEWER. Le autorizzazioni fini su profili di
      integrazione, oggetti documentali, builder, generazione e audit completo restano
      responsabilita' della 006 e delle spec collegate.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-31

  - id: DEC-001-PROFILO-GEBAN
    titolo: Profilo GEBAN versionato e mappatura campi concordata
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/003-sezioni-placeholder-versionamento
      - specs/004-generazione-documenti-pdf
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
    stato: SOSPESA
    assunzione_provvisoria: >
      sospesa per il primo incremento produttivo della 001: il catalogo non filtra per profilo GEBAN versionato,
      ma solo per stato PUBBLICATO, contesto richiesto, tipologia GEBAN/SOL configurata
      e modello_versione_id. La gestione ibrida del profilo GEBAN resta direzione
      attesa per un incremento successivo, dopo allineamento di 002 e 006.
    impatto: >
      rischio residuo tracciato: il primo incremento 001 non impedisce ancora a livello
      di catalogo l'uso di modelli tramite profilo GEBAN versionato; questa limitazione
      e' accettata perche' l'autorizzazione fine resta fuori scope e sara' ripresa con
      builder/profili e sicurezza applicativa.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-07-31

  - id: DEC-001-CONFIG-PROFILO-GEBAN
    titolo: Configurazione del profilo GEBAN
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/009-fondamenta-mock-test-qualita
    stato: SOSPESA
    assunzione_provvisoria: >
      sospesa per il primo incremento produttivo della 001: non viene scelto ora se il profilo GEBAN sara' file
      versionato o dato gestito nel builder; nessun task 001 implementa configurazione,
      stati, pubblicazione o archiviazione del profilo.
    impatto: >
      rischio residuo tracciato: la configurazione definitiva del profilo GEBAN resta
      aperta per 002/006 e per un incremento successivo; il primo incremento 001 espone catalogo e
      contratto dati senza profilo dedicato.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-31

  - id: DEC-001-IDENTIFICATIVI-MODELLO
    titolo: Identificativi e mapping modello GEBAN-GEMODO
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/001-catalogo-contratto-geban
    stato: SOSPESA
    assunzione_provvisoria: >
      GEBAN riceve da GEMODO la lista dei modelli validi alla data, sceglie
      modello/versione, conserva la versione scelta e la reinvia con i dati
      obbligatori. Il piano 001 (aggiornato 2026-07-29) procede con
      modello_versione_id come intero (int64), coerente col contratto OpenAPI gia'
      pubblicato: nessun requisito esplicito richiede oggi un cambio breaking verso un
      identificativo stringa. Gli identificativi stringa nei manifest demo 009 (es.
      demo-bando-concorso-standard-v1) restano etichette leggibili nei manifest di
      qualita', non il formato dell'API.
    impatto: >
      contratto API della 001 (specs/001-catalogo-contratto-geban/contracts/geban-catalog-api.openapi.yaml,
      v0.2.0); rischio residuo: se GEBAN richiedera' un identificativo stringa, sara'
      un cambio breaking sul contratto pubblicato, da coordinare come nuova versione
      major dell'OpenAPI, non una modifica silenziosa.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-29

  - id: DEC-001-RELAZIONE-PROFILO-CATALOGO
    titolo: Relazione tra profilo GEBAN e catalogo GEMODO
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
    stato: SOSPESA
    assunzione_provvisoria: >
      sospesa per il primo incremento produttivo della 001: la relazione esatta tra profilo, tipo documento,
      categoria, sottocategoria, tipologia, variante, modello e versione modello non
      viene modellata nel primo incremento catalogo/contratto.
    impatto: >
      rischio residuo tracciato: il catalogo del primo incremento non applica ancora restrizioni o
      derivazioni da profilo; la relazione profilo/catalogo va definita prima di
      implementare filtri per profilo o builder di profili.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-31

  - id: DEC-001-API-PROFILO-GEBAN
    titolo: API specifiche per profilo GEBAN
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/006-sicurezza-autorizzazioni-audit
    stato: SOSPESA
    assunzione_provvisoria: >
      sospesa per il primo incremento produttivo della 001: non vengono introdotti endpoint dedicati al profilo
      GEBAN; restano solo catalogo, campi richiesti e validazione payload gia' previsti
      dal contratto OpenAPI della 001.
    impatto: >
      rischio residuo tracciato: eventuali endpoint filtrati per profilo richiederanno
      una revisione esplicita del contratto OpenAPI e non devono essere aggiunti come
      estensione silenziosa durante il primo incremento.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-07-31

