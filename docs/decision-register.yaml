    fase_bloccante: TASKS
    data_ultima_revisione: 2026-07-31

  - id: DEC-009-DOCUMENTAZIONE-API
    titolo: Documentazione API e Swagger/OpenAPI
    owner_spec: specs/009-fondamenta-mock-test-qualita
    spec_interessate:
