  - id: DEC-001-OWNERSHIP-DATI-ESTERNI
    titolo: Ownership dei dati esterni - referenziare, non copiare
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
      - specs/010-configurazione-cataloghi-integrazioni
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-15 dopo riunione col team GEBAN/ACE (ADR 0001,
      docs/adr/0001-ownership-dati-esterni-e-onboarding-contesti.md). Per un tipo
      documento integrato con un sistema esterno (es. BANDO_CONCORSO per GEBAN),
      GEMODO non possiede piu' la categorizzazione/contratto dati completi come
      sorgente di verita': possiede solo la struttura del modello (sempre sua) e il
      codice di riferimento usato da ciascun modello, salvato come snapshot alla
      creazione. La definizione completa (etichette, stato attivo, regole) resta
      autoritativa nel sistema esterno, ottenuta via endpoint di discovery
      (DEC-002-PORTS-ADAPTERS-DISCOVERY) con cache locale a TTL breve, mai come
      seed permanente. Per un tipo documento self-service (nessun sistema esterno),
      GEMODO resta l'unico proprietario possibile — nessun cambiamento li'.
      Supera parzialmente DEC-001-CATEGORIE-INIZIALI e
      DEC-001-REGISTRO-CONTRATTI-DATI per il caso GEBAN (restano CONFERMATA, non
      si riportano indietro, vedi le loro note 2026-09-15).
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-15

  - id: DEC-001-ONBOARDING-STRUTTURA-DOCUMENTO
    titolo: Flusso unificato di onboarding di un contesto documentale
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/002-builder-modelli
      - specs/007-frontend-builder-consultazione
      - specs/009-fondamenta-mock-test-qualita
      - specs/010-configurazione-cataloghi-integrazioni
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-15 (ADR 0001). Stesso flusso in 4 passi per GEBAN e per
      ogni futuro contesto, integrato o self-service, eseguito tramite
      un'interfaccia di amministrazione GEMODO (non un file YAML): 1) definizione
      struttura documento (tipo, categorie, tipologie, campi) da un operatore; 2)
      generazione/documentazione del contratto/schema atteso per un eventuale
      endpoint esterno; 3) registrazione dell'endpoint (se il tipo documento e'
      integrato) nella stessa interfaccia; 4) il contesto risulta "connesso" nella
      dashboard admin e diventa possibile creare modelli. Nessun auto-provisioning:
      un token con contesto sconosciuto a GEMODO resta sempre rifiutato, l'onboarding
      resta sempre un'azione amministrativa esplicita. Per GEBAN il passo 1 lo
      esegue oggi il team GEMODO sulla base delle specifiche fornite da GEBAN,
      stesso strumento usato per ogni altro contesto. Costo: richiede costruire
      un'interfaccia admin reale (frontend + API di scrittura + autorizzazione
      amministrativa) in questo incremento, scelta esplicita del product owner
      nonostante il costo aggiuntivo rispetto al percorso file+deploy.
    fase_bloccante: PLAN
    data_ultima_revisione: 2026-09-15

  - id: DEC-002-PORTS-ADAPTERS-DISCOVERY
