  - id: DEC-006-CONFINE-KEYCLOAK-GEMODO
    titolo: Confine Keycloak/GEMODO nelle autorizzazioni applicative
    owner_spec: specs/006-sicurezza-autorizzazioni-audit
    spec_interessate:
