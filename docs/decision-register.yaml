  - id: DEC-001-RITIRO-ENDPOINT-CLASSIFICAZIONE
    titolo: Ritiro delle API GEBAN-facing di classificazione, sostituite dal contratto di discovery
    owner_spec: specs/001-catalogo-contratto-geban
    spec_interessate:
      - specs/010-configurazione-cataloghi-integrazioni
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-15 dal product owner, nel contesto della progettazione
      della 010. Le tre API GEBAN-facing implementate nel primo incremento della
      001 - GET /catalogo/tipi-documento, GET
      /catalogo/tipi-documento/{codice}/profili, GET
      /catalogo/tipi-documento/{codice}/classificazione - rispecchiavano verso
      GEBAN una categorizzazione letta dal seed locale. Con
      DEC-001-OWNERSHIP-DATI-ESTERNI la categorizzazione per un tipo documento
      integrato appartiene al sistema esterno: GEBAN non ha bisogno di richiedere
      a GEMODO il proprio stesso catalogo (tipo documento, profilo, tipologia),
      lo possiede gia'. Le tre API sono quindi ritirate dal contratto pubblico
      verso GEBAN. Il contratto GEBAN-facing si riduce a quattro operazioni,
      tutte relative a COSA HA GEMODO (mai a cosa possiede GEBAN): GET
      /catalogo/modelli (lista dei modelli GEMODO, filtrabile con i codici che
      GEBAN gia' conosce), GET
      /catalogo/modelli/{modello_versione_id}/campi-richiesti, POST
      /documenti/valida, POST /documenti/genera. Al posto delle tre API ritirate,
      GEMODO fornisce agli sviluppatori del sistema esterno un contratto/
      documentazione (non un endpoint runtime nostro) che descrive come deve
      essere strutturato l'endpoint di discovery che LORO devono esporre verso
      GEMODO, con un esempio JSON concreto per ciascun livello configurato
      nell'area di configurazione del modello - e' lo step 2 del flusso di
      onboarding (DEC-001-ONBOARDING-STRUTTURA-DOCUMENTO) e la ragion d'essere
      dell'entita' "Schema Di Discovery Generato" della 010. La navigazione a
      livelli nel builder GEMODO (creazione di un nuovo modello) resta invece
      un'interrogazione live della porta di discovery (DEC-002-PORTS-ADAPTERS-
      DISCOVERY): se il sistema esterno non risponde, GEMODO non puo' sapere
      quali tipi/categorie/tipologie/campi gestire in quel momento, quindi
      l'operazione resta in attesa e viene restituito un errore funzionale di
      connessione al servizio esterno, non un elenco vuoto o stantio.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-09-15

  - id: DEC-006-AUD-ASSENTE-NEI-TOKEN-ACE
    titolo: Il claim aud non e' presente nei token emessi da ACE
    owner_spec: specs/006-sicurezza-autorizzazioni-audit
    spec_interessate:
      - specs/001-catalogo-contratto-geban
      - specs/002-builder-modelli
      - specs/009-fondamenta-mock-test-qualita
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      confermato 2026-09-16 dal product owner contro un token ACE reale: il
      claim `aud` visto finora negli esempi (`SEC-006-003`,
      `specs/006-sicurezza-autorizzazioni-audit/keycloak-jwt.md`) era stato
      impostato manualmente lato client durante i test, non e' valorizzato da
      ACE. Un token ACE reale contiene solo `contexts.<nome>.roles` (es.
      `contexts.geban.roles`, eventualmente insieme ad altri contesti dello
      stesso utente come `contexts.geri.roles` - GEMODO deve derivare
      permessi solo dai contesti che conosce, ignorando gli altri senza
      errore, gia' cosi' in `permessi_da_ruoli_esterni`). Corretto
      `backend/app/common/security.py::decode_principal_from_token`: prima
      richiedeva sempre `aud=gemodo-backend` (PyJWT rifiuta un token con
      `aud` presente se non gli si passa `audience=`, quindi bisogna anche
      disabilitare esplicitamente `verify_aud` e validare a mano, non basta
      omettere il parametro) - senza questa correzione nessun token ACE
      reale sarebbe mai stato accettato. Nuovo comportamento: `aud` assente
      e' accettato (il segnale di destinazione diventa il contesto
      riconosciuto); `aud` presente deve ancora contenere `gemodo-backend`
      (vale per i client diretti GEMODO, `gemodo-frontend`/`geban-backend`,
      che continuano a valorizzarlo). Verificato con test reali
      (`backend/tests/common/test_security_jwt.py`, inclusi due nuovi test:
      token ACE multi-contesto senza `aud`, e `aud` presente ma sbagliato
      ancora rifiutato). Documentazione da correggere ovunque mostri `aud`
      come presente/obbligatorio nell'esempio di token ACE: `keycloak-jwt.md`
      (esempi e regole di validazione), `deploy/coolify-test/index.html`.
    fase_bloccante: NESSUNA
    data_ultima_revisione: 2026-09-16

  - id: DEC-007-FALLBACK-LIVELLO-CATALOGO
    titolo: Fallback al livello generico nella ricerca catalogo
    owner_spec: specs/007-frontend-builder-consultazione
    spec_interessate:
      - specs/001-catalogo-contratto-geban
      - specs/002-builder-modelli
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      Supera PARZIALMENTE la regola "nessun fallback automatico" della sessione
      007 2026-09-18 (mai stata una voce di questo registro, solo prosa in
      spec.md): il fallback vale unicamente per `livello_professionale`, non
      per `lingua` ne' per `percorso_categorizzazione`, che restano a match
      esatto senza fallback. `GET /catalogo/modelli` con un livello specifico
      privo di modello dedicato deve cercare, in un secondo passo esplicito, il
      modello con `livello_professionale IS NULL` (il generico che copre tutti
      i livelli di quel profilo) invece di restituire lista vuota - mai "il
      primo livello trovato", solo quello esplicitamente generico. Motivato dal
      vincolo gia' confermato "tutti i livelli dell'ultima foglia usano lo
      stesso contratto campi" (Clarification 007 sessione 2026-09-21), che
      garantisce compatibilita' anche quando il fallback scatta. Lingua non ha
      fallback perche' ogni edizione linguistica ha un ciclo di vita di
      pubblicazione indipendente (FR-034..038, DEC-001-LINGUA-IT-EN) - tornare
      un'edizione diversa da quella esplicitamente richiesta sarebbe scorretto,
      non solo una scorciatoia.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-09-21

  - id: DEC-002-DEFAULT-VALORE-DIMENSIONE
    titolo: Quale valore proporre di default per una dimensione della categorizzazione
    owner_spec: specs/011-dimensioni-generiche-modello
    spec_interessate:
      - specs/007-frontend-builder-consultazione
      - specs/010-configurazione-cataloghi-integrazioni
    stato: APERTA
    assunzione_provvisoria: >
      Oggi il form di creazione modello preseleziona semplicemente il primo
      valore dell'elenco che la foglia discovery dichiara (per la lingua esce
      'IT' solo perche' l'integrazione GEBAN la elenca per prima, non per una
      regola). Nessuna regola e' scritta da nessuna parte.
    impatto: >
      Ipotesi indicata dall'utente il 2026-09-22: il default e' il primo valore
      nell'ordine dichiarato dall'integrazione, e vale come default soltanto
      quando la dimensione e' obbligatoria, cioe' quando la sua
      PolicyDimensione ha consente_valore_generico=false. Quando la dimensione
      ammette il generico, l'assenza di valore resta la scelta di default.
      Da confermare guardando i dati reali: dipende dal fatto che l'ordine
      restituito dall'integrazione sia significativo e stabile, cosa che il
      contratto di discovery oggi non garantisce. Tocca il form di creazione
      (frontend/src/features/builder/modello-crea.component.ts) e la
      documentazione del contratto discovery.
    fase_bloccante: NESSUNA
    data_ultima_revisione: 2026-09-22

  - id: DEC-002-POLICY-DIMENSIONE-CATEGORIZZAZIONE
    titolo: Policy per-dimensione (genera modello distinto o generico) scollegata dall'esempio di contratto
    owner_spec: specs/002-builder-modelli
    spec_interessate:
      - specs/010-configurazione-cataloghi-integrazioni
      - specs/007-frontend-builder-consultazione
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      Ogni dimensione della categorizzazione (oggi `livello`, `lingua`; in
      futuro altre aggiunte da GEBAN, es. ambito/canale) ha una policy
      booleana `consente_valore_generico`, registrata per
      `tipo_documento_id + nome_dimensione` (non per nodo/foglia: una volta
      per nome, vale ovunque quel nome ricompaia nell'albero). Oggi hardcoded
      nel codice (`livello` -> true, ammette fallback per
      DEC-007-FALLBACK-LIVELLO-CATALOGO; `lingua` -> false, sempre esplicita).
      Va resa una configurazione esplicita e persistita. Punto critico: questa
      policy e' ESPLICITAMENTE SEPARATA da `DefinizioneStruttura`/
      `StrutturaInput` (modulo `configurazione`, che genera solo l'esempio
      presentazionale di contratto per il team dev GEBAN) - non deve mai
      essere letta da li' ne' influenzata da modifiche puramente
      documentali/presentazionali a quell'esempio, per non creare una
      dipendenza fragile fra "documentazione mostrata a GEBAN" e
      "comportamento reale a runtime" (l'albero vero, per un contesto
      integrato, arriva sempre live dall'adapter discovery, mai da li').
      `NodoDiscovery` ha gia' `extra="allow"` (non va in errore su attributi
      sconosciuti) ma li ignora silenziosamente: va aggiunta una segnalazione
      quando l'adapter incontra una dimensione priva di policy registrata,
      invece di lasciarla invisibile.
      CHIUSA 2026-09-22 con l'utente: ripartizione confermata e task scritti.
      `002` possiede entita', migration, API ed enforcement (T065-T072);
      `010` possiede la schermata amministrativa 4a/4b, che scrive le policy
      chiamando quell'API (T089-T094). Resta vincolante la separazione da
      `DefinizioneStruttura`/`StrutturaInput`.
    fase_bloccante: NESSUNA
    data_ultima_revisione: 2026-09-22

  - id: DEC-002-ASSOCIAZIONE-MODELLO-DERIVATO
    titolo: Associazione esplicita fra modello e le sue edizioni collegate, annidata nel catalogo
    owner_spec: specs/002-builder-modelli
    spec_interessate:
      - specs/001-catalogo-contratto-geban
      - specs/007-frontend-builder-consultazione
    stato: CONFERMATA
    assunzione_provvisoria: null
    impatto: >
      Quando si crea un'edizione collegata (oggi "Crea edizione collegata"/
      T067; in UI diventera' "Crea versione inglese" come nome provvisorio),
      il nuovo modello ottiene un riferimento esplicito al modello di origine
      (associazione, non un `famiglia_modello_id` sull'entita' modello - resta
      valido quanto gia' deciso in DEC-001-LINGUA-IT-EN, questa e' una
      relazione a parte). `GET /catalogo/modelli` annida le edizioni collegate
      DENTRO il modello che le referenzia invece di restituirle come righe
      piatte slegate come oggi (`ModelloCatalogoSchema` guadagna una struttura
      annidata). Il meccanismo di fork si applica oggi solo a `lingua`; con
      DEC-002-POLICY-DIMENSIONE-CATEGORIZZAZIONE si generalizza a qualunque
      dimensione con `consente_valore_generico=false`.
    fase_bloccante: TASKS
    data_ultima_revisione: 2026-09-21

  - id: DEC-003-CORPO-DOCUMENTO-RIPIANIFICATO
