<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEMODO</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #5f6b7a;
        --accent: #0b6bcb;
        --line: #d8e0ea;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 16px 44px rgba(23, 32, 51, 0.08);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1;
      }

      p {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 20px;
        line-height: 1.45;
      }

      .status {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--text);
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">CNR GEBAN</p>
      <h1>GEMODO</h1>
      <p>Applicativo per la gestione e generazione dei modelli di documento.</p>
      <p class="status">Ambiente di test collegato al branch <strong>test</strong>.</p>
    </main>
  </body>
</html>
