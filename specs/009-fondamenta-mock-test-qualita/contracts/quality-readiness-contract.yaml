contract: quality-readiness
version: 1
scope: specs/009-fondamenta-mock-test-qualita
purpose: >
  Definire il manifest minimo che deve esistere prima di considerare pronta una
  feature per task implementativi o analisi cross-artifact.

required_sections:
  environment:
    required: true
    fields:
      - profile
      - services
      - healthchecks
      - setup_reference
  seed_demo:
    required: true
    fields:
      - id
      - demo_marker
      - spec_owner
      - resettable
      - contains_real_or_sensitive_data
    rules:
      - contains_real_or_sensitive_data must be false
      - demo_marker must be present for every seed
  contracts:
    required: true
    fields:
      - contract_ref
      - spec_owner
      - success_examples
      - error_examples
    rules:
      - every GEBAN-facing contract must have at least one success example
      - every GEBAN-facing contract must have at least one functional error example
  api_documentation:
    required: true
    fields:
      - openapi_ref
      - api_scope
      - spec_owner
      - endpoints
      - auth_scheme
      - authorization_notes
      - success_examples
      - error_examples
      - error_catalog_ref
      - swagger_enabled
      - redoc_enabled
      - generated_from_same_openapi_source
    rules:
      - every public or integration API must have a versioned OpenAPI contract before runtime implementation
      - swagger_enabled or redoc_enabled must be true in local/test environments
      - generated_from_same_openapi_source must be true
      - success_examples and error_examples must contain only publishable demo data
      - public endpoint names, fields, states and error codes must match the OpenAPI source
  open_source_reuse:
    required: true
    fields:
      - readme
      - license
      - setup
      - development
      - production
      - architecture
      - configuration
      - security
      - contributing
      - vulnerability_reporting
      - tests
      - releases
      - contains_secrets
      - contains_real_personal_data
    rules:
      - contains_secrets must be false
      - contains_real_personal_data must be false
      - license may be DA_CONFERMARE before public release but must be tracked
      - documentation must be textual and versionable
      - README must link the generated documentation portal
  integration_profiles:
    required: true
    fields:
      - system_code
      - client_id
      - expected_audience
      - required_roles_or_claims
      - profile_code
      - profile_status
      - allowed_document_types
      - allowed_categories
      - allowed_model_versions
      - allowed_operations
      - manages_credentials
    rules:
      - manages_credentials must be false
      - Keycloak provides identity, client, audience and coarse roles or claims
      - GEMODO applies fine-grained authorization on profiles, models, contracts and operations
      - active profiles must declare at least one allowed operation
  document_models:
    required: true
    fields:
      - model_version_ref
      - controlled_format
      - page
      - regions
      - allowed_blocks
      - blocks
      - assets
      - allowed_styles
      - placeholders
      - contains_free_html
      - contains_free_css
      - contains_scripts
    rules:
      - contains_free_html must be false
      - contains_free_css must be false
      - contains_scripts must be false
      - blocks must use only allowed block types and positions
      - placeholders must match the model data contract
      - assets must be referenced by id, version and hash when available
  coverage:
    required: true
    fields:
      - spec_owner
      - requirement_id
      - scenario_id
      - contract_ref
      - status
    allowed_status:
      - DA_COPRIRE
      - COPERTO
      - BLOCCATO
  open_decisions:
    required: true
    fields:
      - id
      - title
      - owner_spec
      - impacted_specs
      - status
      - provisional_assumption
      - blocking_phase
    allowed_status:
      - APERTA
      - ASSUNTA_PROVVISORIA
      - CONFERMATA
      - SOSPESA

minimum_quality_gates:
  before_tasks:
    - environment has documented setup and required healthchecks
    - all critical open decisions have owner and blocking phase
    - mock GEBAN scenarios are mapped to contracts
    - seed demo contains no real or sensitive data
    - integration profiles declare system, client, roles or claims and GEMODO fine-grained permissions
    - document model seeds declare controlled blocks, assets, styles and placeholders without free HTML or CSS
    - API-bearing features declare OpenAPI, examples, error catalog and interactive docs
    - open source and PA reuse documentation has an owner and no publishability blockers hidden
  before_implementation:
    - impacted critical decisions are confirmed or explicitly suspended
    - e2e scenarios cover valid flow, validation error, idempotent retry, conflict, failure, unauthorized access
    - audit expectations are documented for sensitive operations
    - authorized and unauthorized scenarios cover both Keycloak coarse authorization and GEMODO profile authorization
    - document model validation rejects unsupported blocks, free HTML, free CSS, scripts and unavailable placeholders
    - runtime endpoints are not implemented before their OpenAPI contract and publishable examples exist
    - documentation examples contain no tokens, secrets, real personal data or sensitive environment URLs

example:
  environment:
    profile: local-dev
    services:
      - backend
      - frontend
      - postgres
      - keycloak
      - documentale-mock
      - mock-geban
    setup_reference: specs/009-fondamenta-mock-test-qualita/quickstart.md
  seed_demo:
    - id: seed-bando-concorso-demo
      demo_marker: DEMO
      spec_owner: specs/001-catalogo-contratto-geban
      resettable: true
      contains_real_or_sensitive_data: false
  api_documentation:
    - openapi_ref: infra/openapi/geban-catalog-api.openapi.yaml
      api_scope: GEBAN
      spec_owner: specs/001-catalogo-contratto-geban
      endpoints:
        - GET /catalogo/tipi-documento
        - GET /catalogo/tipi-documento/{codiceTipoDocumento}/categorie
        - GET /catalogo/modelli
        - GET /catalogo/modelli/{modelloVersioneId}/campi-richiesti
        - POST /documenti/valida
      auth_scheme: bearer-jwt
      authorization_notes: Keycloak validates identity and audience; GEMODO validates integration profile permissions
      success_examples:
        - infra/openapi/examples/catalog-success.json
      error_examples:
        - infra/openapi/examples/validation-error.json
      error_catalog_ref: infra/openapi/errors.md
      swagger_enabled: true
      redoc_enabled: true
      generated_from_same_openapi_source: true
  open_source_reuse:
    readme: README.md
    license: DA_CONFERMARE
    setup: docs/open-source-pa-readiness.md
    development: docs/open-source-pa-readiness.md
    production: docs/open-source-pa-readiness.md
    architecture: docs/open-source-pa-readiness.md
    configuration: docs/open-source-pa-readiness.md
    security: docs/open-source-pa-readiness.md
    contributing: docs/open-source-pa-readiness.md
    vulnerability_reporting: docs/open-source-pa-readiness.md
    tests: docs/open-source-pa-readiness.md
    releases: docs/open-source-pa-readiness.md
    contains_secrets: false
    contains_real_personal_data: false
  integration_profiles:
    - system_code: GEBAN
      client_id: geban-backend
      expected_audience: gemodo-backend
      required_roles_or_claims:
        - DOCUMENTI_GENERATORE
      profile_code: GEBAN_RECLUTAMENTO_V1
      profile_status: ATTIVO
      allowed_document_types:
        - BANDO_CONCORSO
      allowed_categories:
        - DEMO
      allowed_model_versions:
        - demo-bando-concorso-standard-v1
      allowed_operations:
        - catalogo
        - validazione
        - generazione_bozza
        - generazione_ufficiale
        - stato
        - download
      manages_credentials: false
  document_models:
    - model_version_ref: demo-bando-concorso-standard-v1
      controlled_format: GEMODO_DOCUMENT_V1
      page:
        size: A4
        margins: standard-cnr
      regions:
        - header
        - body
        - footer
        - signature_area
      allowed_blocks:
        - INTESTAZIONE
        - LOGO
        - TITOLO
        - PARAGRAFO
        - TABELLA
        - COLONNE
        - FIRMA
        - FOOTER
        - INTERRUZIONE_PAGINA
      blocks:
        - id: header-logo
          type: LOGO
          position: TOP
          asset_ref: logo-cnr-demo
        - id: titolo-bando
          type: TITOLO
          position: BODY
          placeholders:
            - codice_bando
        - id: firma-direttore
          type: FIRMA
          position: BOTTOM_RIGHT
      assets:
        - id: logo-cnr-demo
          version: 1
          hash_file: DEMO_HASH
      allowed_styles:
        - title
        - body
        - signature
      placeholders:
        - codice_bando
        - numero_posti
      contains_free_html: false
      contains_free_css: false
      contains_scripts: false
  open_decisions:
    - id: SEC-006-001
      title: Token tecnico GEBAN verso GEMODO
      owner_spec: specs/006-sicurezza-autorizzazioni-audit
      impacted_specs:
        - specs/005-storage-idempotenza-consultazione
        - specs/009-fondamenta-mock-test-qualita
      status: CONFERMATA
      provisional_assumption: token tecnico Keycloak (client credentials) geban-backend con ruolo DOCUMENTI_GENERATORE; utente reale e contesto GEBAN nel payload solo per audit, risolta 2026-07-29
      blocking_phase: NESSUNA
    - id: SEC-006-002
      title: Separazione revisore/approvatore builder modelli
      owner_spec: specs/006-sicurezza-autorizzazioni-audit
      impacted_specs:
        - specs/002-builder-modelli
        - specs/009-fondamenta-mock-test-qualita
      status: CONFERMATA
      provisional_assumption: flusso minimo senza separazione obbligatoria, GEMODO_MODELLI_GESTORE abilitato anche alla pubblicazione vale come approvazione; ruoli revisore/approvatore riservati e inattivi, risolta 2026-07-29
      blocking_phase: NESSUNA
