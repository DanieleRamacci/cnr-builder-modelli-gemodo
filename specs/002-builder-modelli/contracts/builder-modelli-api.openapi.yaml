            transizione: {value: {codice: TRANSIZIONE_STATO_NON_VALIDA, messaggio: Transizione di stato non valida}}
            altraIntegrazione: {value: {codice: TIPO_DOCUMENTO_ALTRA_INTEGRAZIONE, messaggio: Tipo documento gia' associato a un'altra integrazione dello stesso contesto}}
    InvalidInput:
