openapi: 3.0.3
info:
  title: GEMODO - Builder Modelli
  version: 0.12.0
  description: >
    Creazione e ciclo di vita di modello/versione (007 tasks.md T006). Sostituisce
    integralmente la 0.2.0: quella descriveva tipi documento/categorie come CRUD
    locale del builder, un design pre-010 mai implementato cosi'. Oggi tipi
    documento/categorie sono letti in sola lettura dalla discovery live
    dell'integrazione connessa (vedi integrazioni-api.openapi.yaml, gia'
    pubblicato) - questo contratto copre solo le route realmente implementate in
    backend/app/builder/api.py che quel contratto non gia' copre: lettura
    struttura disponibile per un tipo documento gia' associato, creazione
    modello/versione, transizioni di stato BOZZA -> IN_REVISIONE -> APPROVATO ->
    PUBBLICATO. Nessuna route di archiviazione/sospensione/bozza-derivata esiste
    ancora (Nota Implementazione 2026-09-16 in tasks.md).
servers:
  - url: /api/v1/builder
security:
  - KeycloakBearer: []
paths:
  /contesti:
    get:
      operationId: listaContestiBuilder
      summary: Contesti autorizzati alla gestione modelli, anche senza integrazioni connesse
      responses:
        '200':
          description: Contesti con permesso gestore derivato separatamente
          content:
            application/json:
              schema: {type: array, items: {type: string}}
              example: [geban]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tipi-documento/{codiceTipoDocumento}/struttura-disponibile:
    parameters:
      - {$ref: '#/components/parameters/CodiceTipoDocumento'}
    get:
      operationId: getStrutturaDisponibile
      summary: Struttura discovery del tipo documento gia' associato a un'integrazione
      description: >
        Risolve l'integrazione dal codice_contesto di TipoDocumento (non richiede
        di conoscere l'integrazioneId, a differenza delle route /builder/integrazioni/*
        di integrazioni-api.openapi.yaml). Nessun import DB, sempre letto live.
      x-required-role: GEMODO_MODELLI_GESTORE
      responses:
        '200':
          description: Albero discovery corrente del tipo documento
          content:
            application/json:
              schema: {$ref: '../../010-configurazione-cataloghi-integrazioni/contracts/geban-discovery-endpoint.openapi.yaml#/components/schemas/StrutturaTipoDocumento'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/SourceError'}
        '504': {$ref: '#/components/responses/SourceTimeout'}
  /modelli:
    get:
      operationId: listaModelliBuilder
      summary: Modelli e versioni del contesto autorizzato, comprese bozze
      description: Ordinati per creazione decrescente e id. Non richiede discovery online. Nessuna URL amministrativa esposta.
      parameters:
        - name: codice_contesto
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        # Filtri lato server (007 FR-028). Stanno qui e non nel client perche'
        # la lista e' paginata: filtrare dopo `limit` restituirebbe la pagina in
        # mano invece dell'insieme. Un parametro assente significa "non filtrare".
        - name: codice_tipo_documento
          in: query
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: integrazione_id
          in: query
          schema: {type: string, format: uuid}
        - name: codice_tipologia
          in: query
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: codice_categoria
          in: query
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: lingua
          in: query
          schema: {type: string, enum: [IT, EN]}
        - name: livello_professionale
          in: query
          description: Il token TUTTI seleziona i modelli senza livello, dove la colonna e' nulla.
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: variante
          in: query
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: stato_versione
          in: query
          description: Seleziona i modelli che hanno almeno una versione in questo stato.
          schema:
            type: string
            enum: [BOZZA, IN_REVISIONE, APPROVATO, PUBBLICATO, ARCHIVIATO, SOSPESO]
        - name: ricerca
          in: query
          description: >
            Sottostringa su nome e codice, applicata prima della paginazione.
            Usa ILIKE e non un indice: adeguata a modelli nell'ordine delle
            centinaia, da rivedere se crescessero di ordini di grandezza.
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Pagina modelli filtrata, vuota se nessun modello corrisponde
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ModelloGestione'}}
              example: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/InvalidInput'}
    post:
      operationId: creaModello
      summary: Crea un modello in BOZZA a partire da un percorso o categoria/tipologia risolti in discovery
      description: >
        Autorizzazione per il singolo contesto del tipo documento target
        (verify_scrittura_su_contesto), mai sull'unione dei contesti del token.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento target)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreaModelloRequest'}
            example:
              codice_tipo_documento: BANDO_CONCORSO
              integrazione_id: 00000000-0000-0000-0000-000000000001
              percorso_categorizzazione: [TD, RICERCATORE]
              livello_professionale: VI
              lingua: IT
      responses:
        '201':
          description: Modello creato in stato BOZZA (senza ancora una versione)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Modello'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tipi-documento/{codiceTipoDocumento}/policy-dimensioni:
    parameters:
      - {$ref: '#/components/parameters/CodiceTipoDocumento'}
    get:
      operationId: getPolicyDimensioni
      summary: Policy registrate e dimensioni ancora prive di policy
      description: >
        DEC-002-POLICY. Dichiara, per nome di dimensione della categorizzazione,
        se ammette un valore generico (un solo modello copre tutti i valori) o se
        ogni valore identifica un modello distinto, come gia' accade per la lingua.
        Esplicitamente scollegata da DefinizioneStruttura di `010`, che e' solo
        l'esempio presentazionale per il team dell'integrazione.
        `dimensioni_non_configurate` alimenta la segnalazione della schermata 4a:
        NodoDiscovery ha extra="allow", quindi senza questo elenco una dimensione
        nuova sparirebbe in silenzio.
      x-required-role: GEMODO_MODELLI_GESTORE
      responses:
        '200':
          description: Policy del tipo documento
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyDimensioni'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: setPolicyDimensione
      summary: Registra o aggiorna la policy di una dimensione
      description: >
        Una riga sola per (tipo documento, nome dimensione): la policy vale
        ovunque quel nome ricompaia nell'albero, mai per singola foglia.
        Una dimensione la cui persistenza non ammette un valore assente viene
        rifiutata con GENERICO_NON_SUPPORTATO invece di essere accettata e poi
        salvata con un valore arbitrario.
      x-required-role: GEMODO_MODELLI_GESTORE
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyDimensioneRequest'}
      responses:
        '200':
          description: Policy registrata o aggiornata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyDimensione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: La dimensione non puo' ammettere un valore generico
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Errore'}
              example: {codice: GENERICO_NON_SUPPORTATO, messaggio: "La dimensione 'lingua' non puo' ammettere un valore generico"}
  /modelli/filtri:
    get:
      operationId: vociFiltriModelli
      summary: Valori selezionabili nei filtri dell'elenco modelli
      description: >
        Ricavati dai modelli esistenti nel contesto, non dall'albero discovery:
        l'elenco modelli non richiede discovery online e non deve iniziare a
        dipenderne per riempire delle tendine. Ogni voce restituita produce
        almeno un risultato. Il livello generico compare come TUTTI.
      parameters:
        - name: codice_contesto
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Voci selezionabili, liste vuote se il contesto non ha modelli
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VociFiltriModelli'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/InvalidInput'}

  /modelli/{modelloId}:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
    get:
      operationId: getModelloDettaglio
      summary: Dettaglio modello con il contratto dati, leggibile anche su una BOZZA
      description: >
        Alimenta l'anteprima del modello nel builder (schermata 2b in versione
        ridotta, 007). A differenza di /catalogo/modelli/{modelloVersioneId}/campi-richiesti,
        che risponde solo su versioni pubblicate, qui i campi sono leggibili anche
        su una versione in BOZZA. Stesso isolamento per contesto della lista.
      x-required-role: GEMODO_MODELLI_GESTORE
      responses:
        '200':
          description: Modello con versioni e campi del contratto
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelloDettaglio'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: eliminaModello
      summary: Elimina logicamente un modello conservando versioni, audit e PDF
      parameters:
        - name: modelloId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: 'Modello eliminato, versioni pubblicate archiviate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /modelli/{modelloId}/varianti:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
    post:
      operationId: creaVariante
      summary: Crea una variante dello stesso modello sulla stessa categorizzazione
      description: >
        Eredita tipo, percorso e dimensioni dal modello di origine: si indica
        solo in cosa differisce. Il codice di variante (STANDARD, VARIANTE_1,
        VARIANTE_2...) lo assegna il sistema. Distinta da edizioni-derivate,
        che cambia il valore di una dimensione e non la variante.
        Nasce con una versione 1 in BOZZA che **copia** campi e documento
        dell'ultima versione dell'origine: e' lo stesso bando con una
        differenza dichiarata, e si parte da li' per applicarla. Se l'origine
        non ha versioni, la richiesta e' rifiutata: non c'e' nulla da cui
        partire.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del modello di origine)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreaVarianteRequest'}
            example: {nota: Senza prova preselettiva}
      responses:
        '201':
          description: Variante creata, con la sua versione 1 in BOZZA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelloGestione'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/edizioni-derivate:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
    post:
      operationId: creaEdizioneDerivata
      summary: Crea un modello collegato in un'altra lingua clonando l'ultima versione
      description: >
        Mantiene tipo, percorso, variante e livello del padre. Crea atomicamente
        un modello indipendente e la sua versione 1 BOZZA copiando formato,
        struttura e campi richiesti dall'ultima versione del padre. Non pubblica
        il derivato e non modifica il padre.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del modello padre)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreaEdizioneDerivataRequest'}
            example: {lingua: EN}
      responses:
        '201':
          description: Modello derivato e versione 1 BOZZA creati
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelloGestione'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/versioni:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
    post:
      operationId: creaVersione
      summary: Crea la versione 1 in BOZZA, campi scelti dalla foglia discovery del modello
      description: >
        I campi devono appartenere al ramo/foglia gia' selezionato dal modello in
        discovery corrente (rifetch aggiornato); nessun campo non ammesso o
        duplicato.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreaVersioneRequest'}
            example:
              campi:
                - {codice: codice_bando, lingua: IT}
                - {codice: titolo_it, lingua: IT}
      responses:
        '201':
          description: Versione creata in stato BOZZA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Versione'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /modelli/{modelloId}/versioni/{versioneId}/invia-revisione:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: inviaRevisione
      summary: Transizione BOZZA -> IN_REVISIONE
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      responses:
        '200':
          description: Versione in stato IN_REVISIONE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Versione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/versioni/{versioneId}/approva:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: approvaVersione
      summary: Transizione IN_REVISIONE -> APPROVATO
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      responses:
        '200':
          description: Versione in stato APPROVATO
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Versione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/versioni/{versioneId}/pubblica:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: pubblicaVersione
      summary: Transizione APPROVATO -> PUBBLICATO
      description: >
        Archivia automaticamente la precedente versione corrente della stessa
        variante, se presente (non restituita in risposta - rileggere il catalogo
        per confermarlo).
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      responses:
        '200':
          description: Versione in stato PUBBLICATO, ora esposta dal catalogo (001)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Versione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/versioni/{versioneId}/sospendi:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: sospendiVersione
      summary: Transizione PUBBLICATO -> SOSPESO
      description: >
        Da SOSPESO si puo' solo archiviare: la sospensione non e' una pausa da
        cui si torna indietro.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      responses:
        '200':
          description: Versione in stato SOSPESO
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Versione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/versioni/{versioneId}/archivia:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: archiviaVersione
      summary: Transizione PUBBLICATO o SOSPESO -> ARCHIVIATO
      description: >
        Ritira la versione dal catalogo come scelta esplicita. Prima esisteva
        solo come effetto collaterale della pubblicazione di un'altra versione
        sullo stesso slot.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      responses:
        '200':
          description: Versione in stato ARCHIVIATO
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Versione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /modelli/{modelloId}/versioni/{versioneId}/anteprima:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: anteprimaVersioneModello
      summary: Anteprima PDF di una versione in BOZZA (012 US4)
      description: >
        Compone le sezioni con lo stesso renderer della generazione ufficiale
        (012 FR-008), sostituendo ogni segnaposto con un valore fac-simile nella
        forma «etichetta del campo», o con il valore passato in `valori`. Il PDF
        porta la marcatura di test e una marcatura di anteprima.
        **Non e' una generazione** (012 FR-010): non registra alcun documento,
        non consuma l'idempotenza e non richiede DOCUMENTI_GENERATORE. Chi e'
        gestore di un altro contesto riceve 404, non 403: non si rivela
        l'esistenza di cio' che non puo' vedere.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RichiestaAnteprima'}
      responses:
        '200':
          description: Anteprima prodotta
          headers:
            Content-Disposition:
              schema: {type: string}
              example: inline; filename="anteprima-bando-cter-v3.pdf"
            X-GEMODO-Anteprima:
              description: Sempre `true`; marca la risposta come non ufficiale.
              schema: {type: string, enum: ['true']}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: La versione non e' in BOZZA; su una versione pubblicata si chiede il documento vero
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Errore'}
              example: {codice: MODELLO_VERSIONE_NON_MODIFICABILE, messaggio: "La versione e' in stato PUBBLICATO: l'anteprima si chiede sulle bozze"}
        '422':
          description: Le sezioni non sono componibili secondo il formato documentale
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErroreConViolazioni'}
              example:
                codice: MODELLO_DOCUMENTALE_NON_VALIDO
                messaggio: Struttura del modello documentale non valida
                dettagli:
                  - {violazione: "blocco b1, frammento 0: il testo contiene markup, non ammesso"}
  /modelli/{modelloId}/versioni/{versioneId}/impaginazione:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
      - {$ref: '#/components/parameters/VersioneId'}
    post:
      operationId: impaginazioneVersioneModello
      summary: Dove comincia ogni pagina dell'anteprima della bozza (012 T080, T081)
      description: >
        La misura dell'anteprima: il renderer compone la bozza come per
        `anteprima` e annota, mentre scrive, il blocco e la riga in cui comincia
        ogni pagina dopo la prima. L'editor la usa per disegnare dove finisce un
        foglio. Con le sezioni nel corpo misura il testo che l'editor ha sullo
        schermo e non ha ancora salvato, **senza scriverlo**; senza corpo, quello
        salvato. Stesse regole e stesse autorizzazioni dell'anteprima; nessun PDF
        viene restituito ne' registrato.
      x-required-role: GEMODO_MODELLI_GESTORE (nel contesto del tipo documento del modello)
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '../../003-sezioni-placeholder-versionamento/contracts/sezioni-placeholder-api.openapi.yaml#/components/schemas/SostituisciSezioniRequest'}
      responses:
        '200':
          description: Le pagine dell'anteprima
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Impaginazione'}
              example:
                pagine: 3
                inizi_pagina:
                  - {pagina: 2, sezione: VISTI, blocco: VISTI-b14, voce: null, riga: 2}
                  - {pagina: 3, sezione: Art. 2 - Requisiti, blocco: art2-elenco, voce: 3, riga: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: La versione non e' in BOZZA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Errore'}
        '422':
          description: Le sezioni non sono componibili secondo il formato documentale
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErroreConViolazioni'}
  /profilo:
    get:
      operationId: profiloUtente
      summary: Contesti, ruoli e permessi dell'utente (007 FR-034)
      description: >
        Calcolati dal backend con la stessa mappatura ruoli esterni -> permessi
        che usa per autorizzare. La pagina profilo li mostra; l'interfaccia
        decide da qui cosa offrire, invece di ricostruirlo con regole proprie
        (007 T115). Un contesto i cui ruoli non sono mappati compare senza
        permessi. Basta essere autenticati.
      responses:
        '200':
          description: Profilo dell'utente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profilo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /integrazioni/{integrazioneId}/tipi-documento/{codice}/cornice:
    parameters:
      - {name: integrazioneId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: codice, in: path, required: true, schema: {type: string}}
    get:
      operationId: corniceTipoDocumento
      summary: Intestazione e pie' di pagina del tipo documento (012 FR-011)
      description: >
        Valgono per tutti i modelli del tipo, nel PDF generato e nell'anteprima.
        Le leggono e le impostano il gestore del contesto dell'integrazione e
        l'amministratore. `cornice` e' null finche' non si imposta nulla.
      x-required-role: GEMODO_MODELLI_GESTORE nel contesto dell'integrazione, oppure GEMODO_ADMIN
      responses:
        '200':
          description: Cornice, presenza del logo e maschere disponibili
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorniceTipoDocumento'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    put:
      operationId: impostaCorniceTipoDocumento
      summary: Registra intestazione e pie' di pagina del tipo documento
      x-required-role: GEMODO_MODELLI_GESTORE nel contesto dell'integrazione, oppure GEMODO_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CornicePagina'}
      responses:
        '200':
          description: Cornice salvata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorniceTipoDocumento'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Markup nel testo, troppe righe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErroreConViolazioni'}
              example:
                codice: MODELLO_DOCUMENTALE_NON_VALIDO
                messaggio: Cornice di pagina non valida
                dettagli:
                  - {violazione: "intestazione: 4 righe, al massimo 3"}
  /integrazioni/{integrazioneId}/tipi-documento/{codice}/cornice/logo:
    parameters:
      - {name: integrazioneId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: codice, in: path, required: true, schema: {type: string}}
    get:
      operationId: logoCornice
      summary: Il logo dell'intestazione, come PNG
      x-required-role: GEMODO_MODELLI_GESTORE nel contesto dell'integrazione, oppure GEMODO_ADMIN
      responses:
        '200':
          description: Il logo
          content:
            image/png:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: caricaLogoCornice
      summary: Carica il logo dell'intestazione (PNG o JPEG, al massimo 1 MB)
      description: >
        Il file si apre come immagine e se ne conserva una copia PNG ricodificata:
        metadati o contenuti accodati non arrivano al PDF.
      x-required-role: GEMODO_MODELLI_GESTORE nel contesto dell'integrazione, oppure GEMODO_ADMIN
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Logo salvato}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Non e' un'immagine PNG o JPEG, o e' troppo grande
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErroreConViolazioni'}
              example:
                codice: MODELLO_DOCUMENTALE_NON_VALIDO
                messaggio: Logo non valido
                dettagli:
                  - {violazione: "il file non e' un'immagine PNG o JPEG leggibile"}
    delete:
      operationId: rimuoviLogoCornice
      summary: Toglie il logo dell'intestazione
      x-required-role: GEMODO_MODELLI_GESTORE nel contesto dell'integrazione, oppure GEMODO_ADMIN
      responses:
        '204': {description: Logo rimosso}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /modelli/{modelloId}/cornice:
    parameters:
      - {$ref: '#/components/parameters/ModelloId'}
    get:
      operationId: corniceModello
      summary: La cornice che il modello eredita dal suo tipo documento (012 T070)
      description: >
        Per la scheda dell'editor: la cornice del tipo e dove impostarla
        (integrazione, tipo documento, contesto).
      responses:
        '200':
          description: Cornice del tipo documento del modello
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorniceModello'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    KeycloakBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    CodiceTipoDocumento:
      name: codiceTipoDocumento
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ModelloId:
      name: modelloId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersioneId:
      name: versioneId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    VociFiltriModelli:
      type: object
      required: [codici_tipo_documento, codici_tipologia, codici_categoria, lingue, livelli_professionali, varianti]
      properties:
        codici_tipo_documento: {type: array, items: {type: string}}
        codici_tipologia: {type: array, items: {type: string}}
        codici_categoria: {type: array, items: {type: string}}
        lingue: {type: array, items: {type: string}}
        livelli_professionali: {type: array, items: {type: string}}
        varianti: {type: array, items: {type: string}}
    ModelloGestione:
      type: object
      additionalProperties: false
      required: [id, public_id, codice, nome, codice_tipo_documento, codice_categoria, codice_tipologia, percorso_categorizzazione, variante, dimensioni, lingua, livello_professionale, codice_contesto, integrazione_id, created_at, versioni]
      properties:
        id: {type: string, format: uuid}
        public_id: {type: integer, nullable: true}
        codice: {type: string}
        nome: {type: string}
        codice_tipo_documento: {type: string}
        codice_categoria: {type: string}
        codice_tipologia: {type: string, nullable: true}
        percorso_categorizzazione: {type: array, items: {type: string}}
        variante: {type: string}
        dimensioni:
          type: object
          additionalProperties: {type: string, minLength: 1}
        lingua: {type: string, enum: [IT, EN], nullable: true}
        livello_professionale: {type: string, nullable: true}
        derivato_da_modello_id: {type: string, format: uuid, nullable: true}
        nota:
          type: string
          nullable: true
          description: Descrizione della variante scritta dal gestore; null sul modello standard.
        codice_contesto: {type: string}
        integrazione_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        versioni: {type: array, items: {$ref: '#/components/schemas/Versione'}}
    PolicyDimensioneRequest:
      type: object
      additionalProperties: false
      required: [nome_dimensione, consente_valore_generico]
      properties:
        nome_dimensione: {type: string, minLength: 1, maxLength: 64}
        consente_valore_generico: {type: boolean}
        valore_default: {type: string, minLength: 1, maxLength: 64, nullable: true}
    PolicyDimensione:
      type: object
      additionalProperties: false
      required: [nome_dimensione, consente_valore_generico, valore_default, modelli_pubblicati_che_la_valorizzano]
      description: >
        La policy **effettiva** della dimensione, non solo quella registrata.
        Dove l'admin non ha ancora deciso, la riga riporta il ripiego che il
        backend applica comunque alla creazione dei modelli, con
        `origine: ripiego`: senza, chi legge dedurrebbe una regola diversa da
        quella applicata davvero.
      properties:
        nome_dimensione: {type: string}
        consente_valore_generico: {type: boolean}
        valore_default: {type: string, nullable: true}
        modelli_pubblicati_che_la_valorizzano: {type: integer, minimum: 0}
        origine:
          type: string
          enum: [registrata, ripiego]
          default: registrata
          description: >
            `registrata` se la riga e' stata salvata dall'admin, `ripiego` se e'
            il valore predefinito applicato in assenza di decisione. Il
            comportamento sta comunque in `consente_valore_generico`.
    DimensioneNonConfigurata:
      type: object
      additionalProperties: false
      required: [nome_dimensione, motivo, modelli_pubblicati_che_la_valorizzano]
      properties:
        nome_dimensione: {type: string}
        motivo: {type: string}
        modelli_pubblicati_che_la_valorizzano: {type: integer, minimum: 0}
    PolicyDimensioni:
      type: object
      additionalProperties: false
      required: [codice_tipo_documento, policy, dimensioni_non_configurate]
      properties:
        codice_tipo_documento: {type: string}
        policy: {type: array, items: {$ref: '#/components/schemas/PolicyDimensione'}}
        dimensioni_non_configurate:
          type: array
          items: {$ref: '#/components/schemas/DimensioneNonConfigurata'}
    CampoContratto:
      description: >
        Il campo come lo legge l'anteprima del builder: metadati completi, a
        differenza di CampoVersione che e' la forma di richiesta alla creazione.
      type: object
      additionalProperties: false
      required: [codice, etichetta, tipo, lingua, obbligatorio, ordine]
      properties:
        codice: {type: string}
        etichetta: {type: string}
        tipo: {type: string}
        lingua: {type: string, enum: [IT, EN]}
        obbligatorio: {type: boolean}
        ordine: {type: integer}
        descrizione: {type: string, nullable: true}
    VersioneDettaglio:
      allOf:
        - $ref: '#/components/schemas/Versione'
        - type: object
          required: [campi]
          properties:
            campi: {type: array, items: {$ref: '#/components/schemas/CampoContratto'}}
    ModelloDettaglio:
      type: object
      additionalProperties: false
      required: [id, public_id, codice, nome, codice_tipo_documento, codice_categoria, codice_tipologia, percorso_categorizzazione, variante, dimensioni, lingua, livello_professionale, codice_contesto, integrazione_id, created_at, dimensioni_non_disponibili, versioni]
      properties:
        id: {type: string, format: uuid}
        public_id: {type: integer, nullable: true}
        codice: {type: string}
        nome: {type: string}
        codice_tipo_documento: {type: string}
        codice_categoria: {type: string}
        codice_tipologia: {type: string, nullable: true}
        percorso_categorizzazione: {type: array, items: {type: string}}
        variante: {type: string}
        dimensioni:
          type: object
          additionalProperties: {type: string, minLength: 1}
        lingua: {type: string, enum: [IT, EN], nullable: true}
        livello_professionale: {type: string, nullable: true}
        derivato_da_modello_id: {type: string, format: uuid, nullable: true}
        nota:
          type: string
          nullable: true
          description: Descrizione della variante scritta dal gestore; null sul modello standard.
        codice_contesto: {type: string}
        integrazione_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        dimensioni_non_disponibili:
          type: array
          description: Dimensioni salvate sul modello ma non piu' dichiarate dalla foglia live.
          items: {type: string}
        versioni: {type: array, items: {$ref: '#/components/schemas/VersioneDettaglio'}}
    CreaModelloRequest:
      type: object
      additionalProperties: false
      required: [codice_tipo_documento]
      description: >
        percorso_categorizzazione XOR codice_categoria (+ codice_tipologia
        opzionale se il percorso e' altrimenti ambiguo) - vedi verifica_selezione
        in backend/app/builder/schemas.py.
      properties:
        codice_tipo_documento: {type: string, minLength: 1}
        integrazione_id:
          type: string
          format: uuid
          description: Integrazione selezionata; risolve il tipo per sorgente e codice, senza fallback legacy. Omettere solo per chiamate legacy non ambigue.
        percorso_categorizzazione:
          type: array
          nullable: true
          minItems: 1
          maxItems: 64
          items: {type: string, minLength: 1}
        codice_categoria: {type: string, nullable: true}
        codice_tipologia: {type: string, nullable: true}
        dimensioni:
          type: object
          default: {}
          additionalProperties: {type: string, minLength: 1}
        lingua: {type: string, enum: [IT, EN]}
        livello_professionale:
          type: string
          nullable: true
          description: Valore dichiarato in livelli_possibili; null significa tutti i livelli della foglia.
        nota:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          description: >
            In cosa questo modello differisce dagli altri sulla stessa
            categorizzazione (FR-019). Obbligatoria quando la categorizzazione e'
            gia' occupata: senza, la creazione risponde 409
            MODELLO_VARIANTE_RICHIESTA indicando quale modello la occupa. Il
            codice di variante lo genera il sistema, non il chiamante.
    CreaVarianteRequest:
      type: object
      additionalProperties: false
      required: [nota]
      properties:
        nota: {type: string, minLength: 1, maxLength: 500}
    CreaEdizioneDerivataRequest:
      type: object
      additionalProperties: false
      required: [lingua]
      properties:
        lingua: {type: string, enum: [IT, EN]}
    Modello:
      type: object
      additionalProperties: false
      required: [id, public_id, codice, nome, codice_tipo_documento, codice_categoria, codice_tipologia, percorso_categorizzazione, variante, lingua, livello_professionale]
      properties:
        id: {type: string, format: uuid}
        public_id: {type: integer, nullable: true}
        codice: {type: string}
        nome: {type: string}
        codice_tipo_documento: {type: string}
        codice_categoria: {type: string}
        codice_tipologia: {type: string, nullable: true}
        percorso_categorizzazione: {type: array, items: {type: string}}
        variante: {type: string}
        lingua: {type: string, enum: [IT, EN]}
        livello_professionale: {type: string, nullable: true}
        derivato_da_modello_id: {type: string, format: uuid, nullable: true}
        nota:
          type: string
          nullable: true
          description: Descrizione della variante scritta dal gestore; null sul modello standard.
    CreaVersioneRequest:
      type: object
      additionalProperties: false
      required: [campi]
      properties:
        campi:
          type: array
          items: {$ref: '#/components/schemas/CampoVersione'}
    CampoVersione:
      type: object
      additionalProperties: false
      required: [codice]
      properties:
        codice: {type: string}
        lingua: {type: string, default: IT}
    Versione:
      type: object
      additionalProperties: false
      required: [id, public_id, modello_id, numero_versione, stato, pubblicato_at]
      properties:
        id: {type: string, format: uuid}
        public_id: {type: integer, nullable: true}
        modello_id: {type: string, format: uuid}
        numero_versione: {type: integer}
        stato: {type: string, enum: [BOZZA, IN_REVISIONE, APPROVATO, PUBBLICATO, ARCHIVIATO, SOSPESO]}
        pubblicato_at: {type: string, format: date-time, nullable: true}
    FrammentoTesto:
      type: object
      additionalProperties: false
      required: [testo]
      properties:
        testo: {type: string}
        grassetto: {type: boolean, default: false}
        corsivo: {type: boolean, default: false}
        sottolineato: {type: boolean, default: false}
        collegamento: {type: string, nullable: true}
    CornicePagina:
      type: object
      additionalProperties: false
      properties:
        intestazione:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            maschera: {type: string, enum: [LOGO_CENTRO_TESTO_SOTTO], default: LOGO_CENTRO_TESTO_SOTTO}
            con_logo: {type: boolean, default: true}
            testo:
              type: array
              items: {$ref: '#/components/schemas/FrammentoTesto'}
        pie_pagina:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            maschera: {type: string, enum: [TESTO_SINISTRA_NUMERO_DESTRA], default: TESTO_SINISTRA_NUMERO_DESTRA}
            testo:
              type: array
              items: {$ref: '#/components/schemas/FrammentoTesto'}
            numerazione_pagine: {type: boolean, default: true}
    CorniceTipoDocumento:
      type: object
      additionalProperties: false
      required: [cornice, logo_presente, maschere_intestazione, maschere_pie_pagina]
      properties:
        cornice:
          allOf: [{$ref: '#/components/schemas/CornicePagina'}]
          nullable: true
        logo_presente: {type: boolean}
        maschere_intestazione: {type: array, items: {type: string}}
        maschere_pie_pagina: {type: array, items: {type: string}}
    CorniceModello:
      type: object
      additionalProperties: false
      required: [cornice, logo_presente, maschere_intestazione, maschere_pie_pagina, codice_tipo_documento, codice_contesto]
      properties:
        cornice:
          allOf: [{$ref: '#/components/schemas/CornicePagina'}]
          nullable: true
        logo_presente: {type: boolean}
        maschere_intestazione: {type: array, items: {type: string}}
        maschere_pie_pagina: {type: array, items: {type: string}}
        integrazione_id: {type: string, nullable: true}
        codice_tipo_documento: {type: string}
        codice_contesto: {type: string}
    PermessoProfilo:
      type: object
      additionalProperties: false
      required: [codice, descrizione]
      properties:
        codice: {type: string, example: GEMODO_MODELLI_GESTORE}
        descrizione: {type: string}
    Profilo:
      type: object
      additionalProperties: false
      required: [soggetto, client_id, permessi_diretti, contesti, permessi]
      properties:
        soggetto: {type: string}
        client_id: {type: string}
        permessi_diretti:
          type: array
          items: {$ref: '#/components/schemas/PermessoProfilo'}
        contesti:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codice, ruoli, permessi]
            properties:
              codice: {type: string, example: geban}
              ruoli:
                type: array
                items: {type: string, example: 'ROLE_MANAGER#geban'}
              permessi:
                type: array
                items: {$ref: '#/components/schemas/PermessoProfilo'}
        permessi:
          type: array
          items: {type: string}
    RichiestaAnteprima:
      type: object
      additionalProperties: false
      description: >
        Corpo facoltativo. Omesso, ogni segnaposto assume il fac-simile
        «etichetta del campo». I valori non sono dati ufficiali e non vengono
        conservati.
      properties:
        valori:
          type: object
          additionalProperties: {type: string}
          example: {numero_posti: '2', sede: Roma}
    Impaginazione:
      type: object
      additionalProperties: false
      required: [pagine, inizi_pagina]
      properties:
        pagine: {type: integer, minimum: 1}
        inizi_pagina:
          type: array
          description: Una voce per ogni pagina dopo la prima, in ordine.
          items:
            type: object
            additionalProperties: false
            required: [pagina, sezione, blocco, voce, riga]
            description: >
              Il blocco che si sta scrivendo quando la pagina finisce, nominato come
              lo conosce l'editor (codice della sezione e `id` del blocco), e quante
              sue righe restano sulla pagina prima: 0 se il blocco comincia sulla
              pagina nuova. Senza blocco, la pagina e' cominciata fra due blocchi.
            properties:
              pagina: {type: integer, minimum: 2}
              sezione: {type: string, nullable: true}
              blocco: {type: string, nullable: true}
              voce: {type: integer, minimum: 0, nullable: true, description: "indice della voce, se il blocco e' un elenco"}
              riga: {type: integer, minimum: 0}
    ErroreConViolazioni:
      type: object
      additionalProperties: false
      required: [codice, messaggio]
      properties:
        codice: {type: string}
        messaggio: {type: string}
        dettagli:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [violazione]
            properties:
              violazione: {type: string}
    Errore:
      type: object
      additionalProperties: false
      required: [codice, messaggio]
      properties:
        codice: {type: string}
        messaggio: {type: string}
  responses:
    Unauthorized:
      description: JWT assente o non valido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
          example: {codice: ACCESSO_NON_AUTENTICATO, messaggio: Autenticazione richiesta}
    Forbidden:
      description: Ruolo/contesto non autorizzato (mai sull'unione dei contesti del token)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
          example: {codice: ACCESSO_NON_AUTORIZZATO, messaggio: Operazione non autorizzata}
    NotFound:
      description: Modello/versione inesistente, tipo documento non trovato, o ramo non piu' disponibile in discovery
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
          examples:
            modello: {value: {codice: MODELLO_NON_TROVATO, messaggio: Modello non trovato}}
            versione: {value: {codice: MODELLO_VERSIONE_NON_TROVATO, messaggio: Versione non trovata}}
