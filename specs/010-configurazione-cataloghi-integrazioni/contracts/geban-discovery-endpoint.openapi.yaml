openapi: 3.0.3
info:
  title: Contratto Endpoint Di Discovery GEBAN -> GEMODO
  version: 0.7.0
  description: >
    Questo file descrive la modalita ad albero completo. La proposta alternativa
    a piu' endpoint e' in `geban-discovery-per-nodi.openapi.yaml`, con la guida
    e le risposte JSON in `esempio-discovery-per-nodi/README.md`.

    **Questo NON e' un'API esposta da GEMODO.** E' la specifica di CIO' CHE IL
    TEAM GEBAN DEVE COSTRUIRE.


    ## Cosa devi fare, in sintesi

    1. Implementa **un endpoint HTTP GET**, all'URL che preferisci (lo
    comunicherai a GEMODO, non e' imposto da questo contratto - vedi
    `servers` sotto).

    2. Quando GEMODO lo chiama, rispondi con **un singolo oggetto JSON**: una
    mappa da codice tipo documento (es. `"BANDO_CONCORSO"`) al suo albero di
    categorizzazione, annidato fino ai campi - schema completo in
    `components.schemas.DiscoveryResponse` qui sotto.

    3. Guarda l'**Example Value** dell'operazione `GET` sotto. Per brevita'
    e' compilato **un solo ramo per esteso** (una tipologia, un profilo, i
    suoi campi): la vostra risposta reale ripete la stessa identica forma per
    ciascuna delle vostre tipologie/profili. Gli esempi non sono la lista
    autoritativa dei valori ammessi: servono a mostrare la forma. I valori
    reali che GEMODO usera' per creare un modello saranno quelli restituiti
    dalla vostra API registrata.

    4. **L'albero puo' avere una profondita' diversa per ogni tipo
    documento**: per `BANDO_CONCORSO` sono due livelli (tipologia, poi
    profilo) perche' e' cosi' che GEBAN ci ha descritto la propria
    classificazione - ma non e' una regola fissa del contratto. Un altro tipo
    documento potrebbe avere un solo livello, o tre, o nomi diversi da
    "tipologia"/"profilo": per questo lo schema (`NodoCategorizzazione`
    sotto) e' generico, un nodo puo' avere altri nodi sotto (`figli`) oppure
    essere una foglia con `campi` - mai entrambi. `figli`/`campi` sono le
    uniche chiavi fisse (necessarie per un parsing ricorsivo deterministico);
    il nome concettuale di ogni livello e' invece libero, va nel campo
    opzionale `tipo_livello` di ogni nodo (es. `"tipologia"`, `"profilo"`, o
    un nome del vostro dominio) - puramente informativo, non usato per il
    parsing. **L'unica cosa che DEVE
    restare identica ovunque, a qualunque livello e per qualunque tipo
    documento, e' la struttura di un singolo campo**
    (`components.schemas.CampoContrattoDati`): codice, etichetta, tipo,
    obbligatorio, ordine, e i facoltativi lingua, descrizione, validazione -
    sempre questi attributi, sempre con questo significato, indipendentemente
    da dove nell'albero compare il campo. La lingua sta sulla foglia
    (`lingue`) e non dentro ogni campo: sul campo e' ammessa, dalla 0.7.0,
    solo per restringerlo a una lingua sola.

    5. Potete rispondere anche per piu' di un tipo documento nello stesso
    endpoint (chiavi multiple nella mappa) se vi e' comodo, ma per questa
    integrazione **serve solo `BANDO_CONCORSO`**. Non e' richiesta
    autenticazione su questo endpoint in questa prima versione.


    Il resto di questa pagina spiega il contesto (perche' esiste questo
    contratto) e i dettagli campo per campo - se ti serve solo "cosa devo
    restituire", i 5 punti sopra e l'Example Value bastano.


    **Confine importante**: questo contratto vincola la forma logica comune
    della risposta, non una fotografia statica dei dati. GEMODO valida che la
    risposta sia leggibile secondo questa forma; non rifiuta una risposta solo
    perche' tipologie, profili o campi reali differiscono dagli esempi. Dopo la
    connessione, la creazione dei modelli GEMODO usa i dati restituiti dalla
    vostra API e salva nel proprio DB la struttura scelta in funzione di quei
    dati.


    Descrive l'endpoint che il sistema esterno GEBAN deve implementare ed
    esporre, cosi' che GEMODO possa interrogarlo per scoprire tipologie,
    profili e campi del contratto dati del tipo documento `BANDO_CONCORSO`
    senza che GEMODO ne copii e mantenga una copia locale come sorgente di
    verita' (`DEC-001-OWNERSHIP-DATI-ESTERNI`,
    `docs/adr/0001-ownership-dati-esterni-e-onboarding-contesti.md`).


    **Flusso di integrazione** (`DEC-001-ONBOARDING-STRUTTURA-DOCUMENTO`):
    1. GEMODO genera questo contratto (documento consegnato al team GEBAN);
    2. il team GEBAN implementa un endpoint HTTP GET che risponde con questa
    forma; 3. un operatore GEMODO registra l'URL reale dell'endpoint
    nell'interfaccia di amministrazione (`specs/010-configurazione-cataloghi-
    integrazioni`) ed esegue un test di connessione; 4. solo dopo un test
    riuscito il tipo documento risulta "connesso" e diventa possibile creare
    modelli in GEMODO che referenziano queste tipologie/profili/campi.


    **Paginazione**: se la risposta reale e' paginata (es. envelope HAL/Spring
    Data REST con `_embedded`/`_links`/`page`, come osservato su altri
    endpoint di test GEBAN), il client GEMODO la gestisce in modo trasparente
    assemblando il risultato completo - questo contratto descrive il
    contenuto logico atteso, non impone un formato di trasporto specifico
    (FR-011, `specs/010-configurazione-cataloghi-integrazioni/spec.md`).

    L'envelope paginato supportato e' esplicito: `_embedded.discovery` e'
    un array di frammenti DiscoveryResponse; `_links.next.href` e' il link
    opzionale alla pagina successiva. I frammenti del tipo documento richiesto
    hanno la stessa `validita` e contengono porzioni disgiunte di `nodi` alla
    radice. GEMODO concatena i nodi, non sovrascrive rami duplicati.
    Link e redirect verso altre origini non sono seguiti. Il discovery GEBAN
    attuale usa la risposta completa, senza questo envelope.

    Limiti iniziali dell'adapter, configurabili: 10 secondi complessivi,
    2 MiB complessivi di JSON decompresso, 64 pagine, 64 livelli.
    Il superamento dei limiti produce `DISCOVERY_NON_CONFORME` (HTTP 502 in
    GEMODO); errori di connessione, timeout o risposta HTTP esterna diversa
    da 200 producono `DISCOVERY_NON_DISPONIBILE` (HTTP 503 in GEMODO).
    Questi codici sono esiti del client GEMODO, non errori che GEBAN deve emettere.
    Il server esterno restituisce Content-Type application/json.
    `livelloBase` e' un alias tollerato di `livello_base`: valori discordanti
    se entrambi presenti sono errore. Nessuna inferenza automatica dei vincoli
    del campo livello dalla sola presenza degli attributi sul profilo.


    **Autenticazione dell'endpoint esterno**: da concordare con il team GEBAN,
    non ancora specificata in questa prima versione del contratto.


    **Stato dei dati in questo esempio**: i codici realmente usati sotto
    (`TD`, `COLLABORATORE_TECNICO_ER`) sono verificati sugli endpoint di test
    reali di GEBAN (`https://geban-service.test.si.cnr.it/api/v1/profili`,
    `/api/v1/tipoSols`, 2026-09-15) - l'elenco completo (10 tipologie, 7
    profili) e' in `docs/adr/0001-esempio-discovery-geban.json` come esempio
    operativo iniziale, non come elenco immutabile. Le **combinazioni**
    tipologia-profilo restano da confermare con GEBAN. Il
    meccanismo del campo `livello` (opzioni dipendenti dal profilo scelto) e'
    confermato nel dato (GEBAN gestisce davvero bandi per livelli diversi
    dello stesso profilo) ma non ancora nella forma esatta della risposta
    API: il team GEBAN deve confermare che la implementera' cosi'.
servers:
  - url: https://<host-scelto-da-GEBAN>
    description: >
      URL reale a scelta del team GEBAN, registrato successivamente
      nell'interfaccia di amministrazione GEMODO. Il path sotto e' un esempio
      illustrativo, non un vincolo sul path reale.
paths:
  /discovery:
    get:
      summary: Discovery albero di categorizzazione e campi (esempio di path)
      description: >
        **Questa e' l'operazione che dovete implementare voi (team GEBAN).**
        Il path `/discovery` qui sotto e' solo un esempio - implementatela
        dove preferite. La risposta 200 MUST avere esattamente la forma di
        `DiscoveryResponse`: guardate il pannello "Example Value" della
        risposta 200 qui sotto - mostra due tipi documento di esempio con
        **profondita' dell'albero diversa e piu' rami per livello**
        (`BANDO_CONCORSO` a due livelli, il secondo a tre livelli con piu'
        rami), per chiarire che ne' la profondita' ne' il numero di rami sono
        fissi. Solo il primo ramo di ciascun livello e' compilato per esteso.


        Chiamato da GEMODO per navigazione e verifica della compatibilita'
        corrente; la validazione dei valori ricevuti resta contro il contratto
        immutabile del modello. Il test di connessione
        verifica la forma della risposta, non l'uguaglianza dei valori reali
        rispetto agli esempi.
      operationId: getDiscovery
      responses:
        "200":
          description: Albero di categorizzazione e contratto dati per tipo documento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
              examples:
                bandoConcorso:
                  $ref: "#/components/examples/BandoConcorsoDiscoveryExample"
        "503":
          description: Catalogo temporaneamente non disponibile (esempio di errore esterno)
          content:
            application/json:
              schema:
                type: object
                required: [codice, messaggio]
                properties:
                  codice: {type: string}
                  messaggio: {type: string}
              example:
                codice: CATALOGO_NON_DISPONIBILE
                messaggio: Servizio temporaneamente non disponibile
components:
  examples:
    BandoConcorsoDiscoveryExample:
      summary: >-
        BANDO_CONCORSO a due livelli (tipologia poi profilo), un secondo tipo
        documento di esempio a tre livelli con piu' rami - stessa struttura
        di campo in entrambi, tipo_livello etichetta ogni nodo
      value:
        BANDO_CONCORSO:
          validita: "2026-09-15T00:00:00Z"
          nodi:
            - codice: TD
              descrizione: Tempo Determinato
              tipo_livello: tipologia
              figli:
                - codice: COLLABORATORE_TECNICO_ER
                  descrizione: Collaboratore Tecnico E.R.
                  tipo_livello: profilo
                  livelli_possibili: ["IV", "V", "VI"]
                  livello_base: "VI"
                  lingue_possibili: [IT, EN]
                  campi:
                    - codice: codice_bando
                      etichetta: Codice bando
                      tipo: string
                      lingua: IT
                      obbligatorio: true
                      ordine: 1
                      descrizione: Identificativo funzionale del bando
                      validazione: { minLength: 1 }
                    - codice: titolo_it
                      etichetta: Titolo
                      tipo: string
                      lingua: IT
                      obbligatorio: true
                      ordine: 2
                      descrizione: Titolo italiano del bando
                      validazione: { minLength: 1 }
                    - codice: descrizione_ridotta_it
                      etichetta: Descrizione ridotta
                      tipo: string
                      lingua: IT
                      obbligatorio: false
                      ordine: 3
                      descrizione: Sintesi italiana del bando
                      validazione: null
                    - codice: sede_prescelta_it
                      etichetta: Sede
                      tipo: string
                      lingua: IT
                      obbligatorio: true
                      ordine: 4
                      descrizione: Sede associata alla procedura
                      validazione: { minLength: 1 }
                    - codice: numero_posti
                      etichetta: Numero posti
                      tipo: number
                      lingua: IT
                      obbligatorio: true
                      ordine: 5
                      descrizione: Numero dei posti previsti
                      validazione: { minimum: 1 }
                    - codice: titolo_en
                      etichetta: Title
                      tipo: string
                      lingua: EN
                      obbligatorio: true
                      ordine: 6
                      descrizione: Titolo inglese del bando
                      validazione: { minLength: 1 }
                    - codice: livello
                      etichetta: Livello
                      tipo: string
                      lingua: IT
                      obbligatorio: true
                      ordine: 7
                      descrizione: Livello professionale del bando
                      validazione:
                        fonte_opzioni: profilo.livelli_possibili
                        default: profilo.livello_base
        ALTRO_TIPO_DOCUMENTO_ESEMPIO:
          _nota: >-
            Placeholder - se volete integrare anche un altro tipo documento
            con lo stesso endpoint (facoltativo, per questa integrazione
            serve solo BANDO_CONCORSO). Qui l'albero e' volutamente PIU'
            PROFONDO di BANDO_CONCORSO (tre livelli invece di due) e con piu'
            rami per livello, per mostrare che ne' la profondita' ne' il
            numero di rami sono fissati dal contratto. Per brevita' solo il
            primo ramo di ogni livello e' compilato fino ai campi; gli altri
            rami (`CATEGORIA_ESEMPIO_B`, `SOTTOCATEGORIA_ESEMPIO_A2`,
            `DETTAGLIO_ESEMPIO_A1_II`) sono presenti solo con codice/
            descrizione per mostrare che possono esserci piu' rami allo
            stesso livello, senza svilupparli oltre. Gli otto attributi di
            ogni campo restano identici a quelli di BANDO_CONCORSO.
          validita: "2026-09-15T00:00:00Z"
          nodi:
            - codice: CATEGORIA_ESEMPIO_A
              descrizione: Primo ramo del primo livello (sviluppato per esteso)
              tipo_livello: area
              figli:
                - codice: SOTTOCATEGORIA_ESEMPIO_A1
                  descrizione: Primo ramo del secondo livello (sviluppato per esteso)
                  tipo_livello: categoria
                  figli:
                    - codice: DETTAGLIO_ESEMPIO_A1_I
                      descrizione: Primo ramo del terzo livello - qui e' foglia, ha campi
                      tipo_livello: dettaglio
                      campi:
                        - codice: esempio_campo
                          etichetta: Campo di esempio
                          tipo: string
                          lingua: IT
                          obbligatorio: true
                          ordine: 1
                          descrizione: Stessa struttura del campo usata sopra per BANDO_CONCORSO
                          validazione: { minLength: 1 }
                    - codice: DETTAGLIO_ESEMPIO_A1_II
                      descrizione: Secondo ramo del terzo livello - non sviluppato oltre, solo per mostrare che ce ne puo' essere piu' di uno
                      tipo_livello: dettaglio
                - codice: SOTTOCATEGORIA_ESEMPIO_A2
                  descrizione: Secondo ramo del secondo livello - non sviluppato oltre
                  tipo_livello: categoria
            - codice: CATEGORIA_ESEMPIO_B
              descrizione: Secondo ramo del primo livello - non sviluppato oltre
              tipo_livello: area
  schemas:
    DiscoveryResponse:
      type: object
      description: >
        Mappa da codice tipo documento alla sua struttura. Nel caso reale di
        oggi conterra' sempre e solo la chiave `BANDO_CONCORSO`.
      additionalProperties:
        $ref: "#/components/schemas/StrutturaTipoDocumento"
    StrutturaTipoDocumento:
      type: object
      required: [validita, nodi]
      properties:
        validita:
          type: string
          format: date-time
          description: >
            Data/ora fornita dal sistema esterno, mostrabile come metadato.
            Nel servizio attuale varia a ogni richiesta: non e' una versione
            affidabile del catalogo ed e' esclusa dalle firme di compatibilita'.
        nodi:
          type: array
          description: Primo livello dell'albero di categorizzazione di questo tipo documento.
          items:
            $ref: "#/components/schemas/NodoCategorizzazione"
    NodoCategorizzazione:
      type: object
      required: [codice, descrizione]
      description: >
        Un nodo dell'albero, a qualunque livello. Ha SEMPRE `codice` e
        `descrizione`; ha POI o `figli` (per scendere di un altro livello,
        stesso schema ricorsivo) o `campi` (se e' un nodo foglia) - mai
        entrambi, mai nessuno dei due. Il numero di livelli non e' fissato
        dal contratto: per `BANDO_CONCORSO` sono due (tipologia, poi
        profilo), un altro tipo documento potrebbe averne uno solo, tre o
        piu' - vedi il secondo esempio (`ALTRO_TIPO_DOCUMENTO_ESEMPIO`, tre
        livelli) qui sopra. `figli`/`campi` restano le uniche chiavi
        strutturali fisse (necessarie per un parsing ricorsivo deterministico
        lato GEMODO, indipendentemente da quanti livelli ci sono); il nome
        concettuale di ciascun livello (tipologia, profilo, o qualunque cosa
        abbia senso per il vostro dominio) e' invece libero e va nel campo
        `tipo_livello` sotto - puramente informativo, non usato per il
        parsing.
      properties:
        codice:
          type: string
          example: TD
        descrizione:
          type: string
          example: Tempo Determinato
        tipo_livello:
          type: string
          nullable: true
          description: >
            Nome del livello di categorizzazione a cui appartiene questo
            nodo (es. `"tipologia"`, `"profilo"`, o un nome del vostro
            dominio). Puramente informativo/leggibile per chi consulta la
            risposta - GEMODO non lo usa per decidere come camminare
            l'albero (quello dipende solo da `figli`/`campi`). Opzionale.
        livelli_possibili:
          type: array
          description: >
            Attributo profilo-dipendente (generalizza il caso "livello",
            vedi `Attributo Profilo` in
            `specs/010-configurazione-cataloghi-integrazioni/spec.md`).
            Opzionale, ha senso solo su un nodo foglia (con `campi`).
          items:
            type: string
          example: ["I", "II", "III"]
        livello_base:
          type: string
          description: Valore di default fra `livelli_possibili` per questo nodo, se presente.
          example: "III"
        lingue_possibili:
          type: array
          minItems: 1
          uniqueItems: true
          description: >
            Lingue dei modelli creabili sulla foglia. **Opzionale** (0.6.0,
            spec 011): un tipo documento che non distingue i modelli per lingua
            semplicemente non dichiara questa chiave, e GEMODO non gliene
            attribuisce una implicita. Fino alla 0.5.0 era obbligatoria sui
            nodi con `campi`, e una foglia priva di lingua rendeva non
            conforme l'intera risposta. E' un rilassamento: ogni albero valido
            con la 0.5.0 resta valido, nessuna integrazione deve cambiare
            nulla. Resta assente sui nodi intermedi. Non filtra i campi: ogni
            modello conserva l'intero contratto della foglia.
          items:
            type: string
            enum: [IT, EN]
          example: [IT, EN]
        figli:
          type: array
          description: >
            Sotto-nodi, se questo non e' un livello foglia. Un array vuoto e'
            valido (nodo senza sotto-categorizzazione ancora definita) ma
            MUST essere compilato prima dell'uso in produzione, non lasciato
            vuoto silenziosamente.
          items:
            $ref: "#/components/schemas/NodoCategorizzazione"
        campi:
          type: array
          description: >
            Campi del contratto dati, presenti solo se questo e' un nodo
            foglia (nessun `figli`). Se, come nel caso reale di
            BANDO_CONCORSO, gli stessi campi si ripetono identici su piu'
            foglie, e' una scelta legittima ripeterli qui uguali - questo
            contratto non impone un meccanismo di riuso, descrive solo la
            forma della risposta.
          items:
            $ref: "#/components/schemas/CampoContrattoDati"
    CampoContrattoDati:
      type: object
      description: >
        Struttura FISSA per ogni campo, identica a qualunque livello
        dell'albero e per qualunque tipo documento - e' l'unica parte di
        questo contratto che non cambia mai.
      required: [codice, etichetta, tipo, obbligatorio, ordine]
      properties:
        codice:
          type: string
          example: numero_posti
        etichetta:
          type: string
          example: Numero posti
        tipo:
          type: string
          description: >
            Stesso vocabolario di `ModelloCampoRichiesto.tipo_dato`
            (`001`/`002`): `string`, `number`, `date`, `boolean`, `array`,
            `object`. Nessun tipo `enum` dedicato - un campo con opzioni
            vincolate (fisse o dipendenti dal profilo) resta `string`/
            `number` con il vincolo espresso in `validazione`.
          enum: [string, number, date, boolean, array, object]
        lingua:
          type: string
          enum: [IT, EN]
          nullable: true
          description: >
            **Opzionale dalla 0.7.0.** La lingua e' una proprieta' della
            foglia (`lingue`), non del singolo campo: una foglia dichiara un
            contratto campi solo, che vale per tutte le lingue che dichiara.
            Indicate `lingua` su un campo solo se quel campo esiste in una
            lingua sola, e allora vale come restrizione. Fino alla 0.6.0 era
            obbligatoria su ogni campo, e un albero che la ometteva risultava
            interamente non conforme. E' un rilassamento: ogni albero valido
            con la 0.6.0 resta valido, nessuna integrazione deve cambiare
            nulla.
        obbligatorio:
          type: boolean
        ordine:
          type: integer
          minimum: 1
        descrizione:
          type: string
          nullable: true
        validazione:
          type: object
          nullable: true
          description: >
            Vincoli semplici (es. `minLength`, `minimum`) oppure, per un
            campo dipendente da un attributo profilo, un riferimento
            simbolico invece di un elenco statico:
            `{"fonte_opzioni": "profilo.<nome_attributo>", "default":
            "profilo.<nome_attributo>_base"}`, risolto da GEMODO contro il
            profilo scelto in fase di creazione modello.
