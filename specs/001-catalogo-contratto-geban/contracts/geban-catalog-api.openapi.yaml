openapi: 3.0.3
info:
  title: GEBAN GEMODO Catalogo Modelli API
  version: 0.9.0
  description: >
    API per catalogo modelli, contratto dati e validazione payload verso GEBAN.
    Versione 0.2.0: aggiunge validazione tipologia GEBAN/SOL (codice_tipologia),
    campi con metadato lingua - vedi docs/decision-register.yaml,
    DEC-001-TIPOLOGIE-SOL e DEC-001-LINGUA-IT-EN.
    Versione 0.3.0: le API operative richiedono JWT Bearer Keycloak con audience
    gemodo-backend e ruoli DOCUMENTI_VIEWER/DOCUMENTI_GENERATORE.
    Versione 0.4.0 (010 FR-016): ritiro API classificazione locale;
    modelli e contratti delle versioni restano proprieta GEMODO.
    Versione 0.6.0 (004 FR-019/020): ritiro di POST /documenti/genera
    (simulato) - la generazione reale e' descritta nel contratto di 004,
    stesso percorso HTTP.
servers:
  - url: /api/v1
security:
  - KeycloakBearer: []
  - KeycloakSSO: []
paths:
  /catalogo/modelli:
    get:
      summary: Ricerca modelli pubblicati
      description: Richiede ruolo DOCUMENTI_VIEWER o DOCUMENTI_GENERATORE.
      operationId: searchModelli
      parameters:
        - name: tipo_documento
          in: query
          required: true
          schema:
            type: string
        - name: profilo
          in: query
          required: false
          description: Profilo professionale selezionato sotto la tipologia/procedura bando.
          schema:
            type: string
        - name: codice_tipologia
          in: query
          required: false
          description: >
            Codice della tipologia nella discovery esterna, confrontato con i
            riferimenti salvati nei soli modelli GEMODO. Nessuna allowlist locale;
            se non esistono modelli pubblicati corrispondenti restituisce elenco vuoto.
          schema:
            type: string
        - name: lingua
          in: query
          required: false
          description: Lingua del modello pubblicato.
          schema:
            type: string
            enum: [IT, EN]
        - name: livello_professionale
          in: query
          required: false
          description: >
            Forma compatibile del filtro dimensione[livello_professionale]. Il
            fallback dipende dalla policy della dimensione, non dal suo nome.
          schema:
            type: string
        - name: dimensione
          in: query
          required: false
          style: deepObject
          explode: true
          description: Filtro per dimensione arbitraria, ad esempio dimensione[area_geografica]=NORD.
          schema:
            type: object
            additionalProperties: {type: string}
        - name: modalita
          in: query
          required: false
          description: OPERATIVA restituisce modelli usabili; STORICO restituisce versioni archiviate o storiche.
          schema:
            type: string
            enum: [OPERATIVA, STORICO]
            default: OPERATIVA
        - name: data_riferimento
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: pubblicato_da
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: pubblicato_a
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Modelli pubblicati filtrati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelloSearchResponse"
              example:
                tipo_documento: BANDO_CONCORSO
                profilo: COLLABORATORE_TECNICO_ER
                codice_tipologia: TI
                modalita: OPERATIVA
                fallback_applicato: true
                livello_richiesto: V
                livello_risolto: null
                modelli:
                  - modello_id: 101
                    modello_versione_id: 201
                    codice: bando-ti-collaboratore-tecnico-er-tutti-it
                    descrizione: Collaboratore Tecnico E.R. - Tutti i livelli - Italiano
                    variante: STANDARD
                    lingua: IT
                    livello_professionale: null
                    versione: 1
                    stato: PUBBLICATO
                    data_inizio_validita: null
                    data_fine_validita: null
                    pubblicato_at: "2026-09-21T20:35:20Z"
                    edizioni_derivate:
                      - modello_id: 102
                        modello_versione_id: 202
                        codice: bando-ti-collaboratore-tecnico-er-tutti-en
                        descrizione: Collaboratore Tecnico E.R. - Tutti i livelli - Inglese
                        variante: STANDARD
                        lingua: EN
                        livello_professionale: null
                        versione: 1
                        stato: PUBBLICATO
                        data_inizio_validita: null
                        data_fine_validita: null
                        pubblicato_at: "2026-09-21T20:36:10Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/AmbiguousSource"
  /catalogo/modelli/{modelloVersioneId}/campi-richiesti:
    get:
      summary: Contratto dati per versione modello pubblicata
      description: Richiede ruolo DOCUMENTI_VIEWER o DOCUMENTI_GENERATORE.
      operationId: getCampiRichiesti
      parameters:
        - $ref: "#/components/parameters/ModelloVersioneId"
      responses:
        "200":
          description: Contratto dati della versione modello
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampiRichiestiResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /documenti/valida:
    post:
      summary: Valida payload contro contratto dati
      description: Richiede ruolo DOCUMENTI_GENERATORE.
      operationId: validaPayload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidazioneRequest"
      responses:
        "200":
          description: Esito validazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidazioneResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /documenti/genera:
    post:
      deprecated: true
      x-implementation-status: withdrawn
      summary: Simula richiesta generazione documento (ritirato)
      description: >
        Disegno storico ritirato, non operativo: la generazione e' reale dal
        2026-09-17 (004 FR-019/020), descritta in
        specs/004-generazione-documenti-pdf/contracts/generazione-documenti-api.openapi.yaml.
        Stesso percorso HTTP, nuovo contratto - vedi 001 FR-019 (questa spec
        non descrive il dettaglio della generazione PDF).
      operationId: generaDocumentoPlaceholder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidazioneRequest"
      responses:
        "200":
          description: Esito simulazione generazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerazioneDocumentoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    KeycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT Keycloak emesso dal realm CNR, con audience gemodo-backend e ruoli client in
        resource_access.gemodo-backend.roles. Le chiamate GEBAN usano client tecnico
        geban-backend.
    KeycloakSSO:
      type: oauth2
      description: >
        Login SSO CNR per test interattivo Swagger con client pubblico gemodo-frontend
        e Authorization Code + PKCE. Il token deve avere audience gemodo-backend e ruoli
        client in resource_access.gemodo-backend.roles.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.test.si.cnr.it/auth/realms/cnr/protocol/openid-connect/auth
          tokenUrl: https://sso.test.si.cnr.it/auth/realms/cnr/protocol/openid-connect/token
          scopes:
            openid: Identita' OpenID Connect
            profile: Profilo utente CNR
            email: Email utente CNR
  parameters:
    ModelloVersioneId:
      name: modelloVersioneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    AmbiguousSource:
      description: Codice tipo ambiguo; indicare l'integrazione, nessuna selezione automatica
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {codice: SORGENTE_AMBIGUA, messaggio: Indicare l'integrazione del tipo documento}
    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Token mancante, scaduto o non valido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Client o ruolo non autorizzato per l'operazione richiesta
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Risorsa non utilizzabile nello stato corrente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ModelloSearchResponse:
      type: object
      required: [tipo_documento, fallback_applicato, dimensioni_rilassate, livello_richiesto, livello_risolto, modelli]
      properties:
        tipo_documento:
          type: string
        profilo:
          type: string
          nullable: true
        codice_tipologia:
          type: string
          nullable: true
        modalita:
          type: string
          enum: [OPERATIVA, STORICO]
        fallback_applicato:
          type: boolean
        dimensioni_rilassate:
          type: array
          items: {type: string}
        livello_richiesto:
          type: string
          nullable: true
        livello_risolto:
          type: string
          nullable: true
        modelli:
          type: array
          items:
            $ref: "#/components/schemas/ModelloCatalogo"
    ModelloCatalogo:
      type: object
      required: [modello_id, modello_versione_id, codice, descrizione, variante, dimensioni, lingua, livello_professionale, versione, stato, edizioni_derivate]
      properties:
        modello_id:
          type: integer
          format: int64
        modello_versione_id:
          type: integer
          format: int64
        codice:
          type: string
        descrizione:
          type: string
        variante:
          type: string
        lingua:
          type: string
          enum: [IT, EN]
          nullable: true
          example: IT
        dimensioni:
          type: object
          additionalProperties: {type: string}
        livello_professionale:
          type: string
          nullable: true
        versione:
          type: integer
        stato:
          type: string
          enum: [PUBBLICATO]
        data_inizio_validita:
          type: string
          format: date
          nullable: true
        data_fine_validita:
          type: string
          format: date
          nullable: true
        pubblicato_at:
          type: string
          format: date-time
          nullable: true
        edizioni_derivate:
          type: array
          description: >
            Edizioni pubblicate create esplicitamente da questo modello. Se il
            filtro lingua seleziona solo il derivato, il derivato resta al primo
            livello per rispettare il filtro.
          items:
            $ref: "#/components/schemas/EdizioneDerivataCatalogo"
    EdizioneDerivataCatalogo:
      type: object
      required: [modello_id, modello_versione_id, codice, descrizione, variante, dimensioni, lingua, livello_professionale, versione, stato]
      properties:
        modello_id: {type: integer, format: int64}
        modello_versione_id: {type: integer, format: int64}
        codice: {type: string}
        descrizione: {type: string}
        variante: {type: string}
        lingua: {type: string, enum: [IT, EN], nullable: true, example: EN}
        dimensioni:
          type: object
          additionalProperties: {type: string}
        livello_professionale: {type: string, nullable: true}
        versione: {type: integer}
        stato: {type: string, enum: [PUBBLICATO]}
        data_inizio_validita: {type: string, format: date, nullable: true}
        data_fine_validita: {type: string, format: date, nullable: true}
        pubblicato_at: {type: string, format: date-time, nullable: true}
    CampiRichiestiResponse:
      type: object
      required: [modello_versione_id, campi, schema]
      properties:
        modello_versione_id:
          type: integer
          format: int64
        tipo_documento:
          type: string
        profilo:
          type: string
        campi:
          type: array
          items:
            $ref: "#/components/schemas/CampoRichiesto"
        schema:
          type: object
          additionalProperties: true
    CampoRichiesto:
      type: object
      required: [codice, etichetta, tipo, lingua, obbligatorio, ordine]
      properties:
        codice:
          type: string
        etichetta:
          type: string
        tipo:
          type: string
          enum: [string, number, date, boolean, array, object]
        lingua:
          type: string
          enum: [IT, EN]
          default: IT
          description: Metadato del campo; l'obbligatorieta' e' quella del contratto della versione modello selezionata.
        obbligatorio:
          type: boolean
        ordine:
          type: integer
        descrizione:
          type: string
          nullable: true
        validazione:
          type: object
          additionalProperties: true
          nullable: true
    ValidazioneRequest:
      type: object
      required: [sistema_richiedente, external_context_id, modello_versione_id, dati]
      additionalProperties: false
      properties:
        sistema_richiedente:
          type: string
          example: GEBAN
        external_context_id:
          type: string
        modello_versione_id:
          type: integer
          format: int64
        data_riferimento:
          type: string
          format: date
          nullable: true
        dati:
          type: object
          additionalProperties: true
    ValidazioneResponse:
      type: object
      required: [valido, errori]
      properties:
        valido:
          type: boolean
        errori:
          type: array
          items:
            $ref: "#/components/schemas/ErroreValidazione"
    GenerazioneDocumentoResponse:
      type: object
      required: [stato, messaggio, modello_versione_id, external_context_id, validazione]
      properties:
        stato:
          type: string
          enum: [GENERAZIONE_SIMULATA, DATI_NON_VALIDI]
        messaggio:
          type: string
        modello_versione_id:
          type: integer
          format: int64
        external_context_id:
          type: string
        download_placeholder:
          type: string
          nullable: true
          example: Qui sara' disponibile il link per scaricare il PDF generato.
        validazione:
          $ref: "#/components/schemas/ValidazioneResponse"
    ErroreValidazione:
      type: object
      required: [codice, messaggio]
      properties:
        campo:
          type: string
          nullable: true
        codice:
          type: string
        messaggio:
          type: string
    ErrorResponse:
      type: object
      required: [codice, messaggio]
      properties:
        codice:
          type: string
        messaggio:
          type: string
