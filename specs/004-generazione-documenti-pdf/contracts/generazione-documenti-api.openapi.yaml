openapi: 3.0.3
info:
  title: GEMODO - Generazione Documenti (Incremento MVP FR-019/020)
  version: 0.4.0
  description: >
    Sostituisce la risposta simulata storica di 001 (GenerazioneDocumentoResponse,
    ora ritirata in geban-catalog-api.openapi.yaml). Produce un PDF reale, sempre
    non ufficiale (etichettato TEST). Una sola chiamata basta per ottenere il file.
    Dalla 0.4.0 (spec 013) GEMODO non conserva il PDF e non blocca piu' le
    ripetizioni: la stessa chiave (sistema_richiedente + external_context_id +
    versione del modello) si puo' usare quante volte serve, anche con dati
    diversi - per esempio per rigenerare un bando dopo ogni correzione. Ogni
    chiamata e' una generazione nuova, con un riferimento nuovo, registrata con le
    impronte dei dati e del PDF (registro: storage-documenti-api.openapi.yaml).
servers:
  - url: /api/v1
security:
  - KeycloakBearer: []
paths:
  /documenti/genera:
    post:
      operationId: generaDocumento
      summary: Valida il payload e, se COMPLETATO, ritorna subito il PDF prodotto
      description: >
        Una sola chiamata: se la generazione ha successo il corpo della
        risposta 200 e' direttamente il file PDF (application/pdf), con
        l'header X-Riferimento-Documentale che identifica questa generazione
        nel registro. Se lo stato e' FALLITO o DATI_NON_VALIDI il corpo e'
        JSON (EsitoGenerazione): non c'e' file. Anche queste chiamate sono
        registrate. Il PDF si consegna solo dopo la registrazione: se il
        registro non e' disponibile la risposta e' 503 e la chiamata si ripete.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RichiestaGenerazione'}
      responses:
        '200':
          description: >
            COMPLETATO: corpo binario PDF.
            FALLITO/DATI_NON_VALIDI: corpo JSON EsitoGenerazione.
          headers:
            X-Riferimento-Documentale:
              description: Presente solo quando il corpo e' il PDF (stato COMPLETATO)
              schema: {type: string}
            Content-Disposition:
              description: Presente solo quando il corpo e' il PDF (stato COMPLETATO)
              schema: {type: string}
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/json:
              schema: {$ref: '#/components/schemas/EsitoGenerazione'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versione modello non pubblicata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Errore'}
        '503':
          description: >
            REGISTRO_GENERAZIONI_NON_DISPONIBILE - la generazione non si e'
            potuta registrare e il PDF non e' stato consegnato: ripetere.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Errore'}
components:
  securitySchemes:
    KeycloakBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    RichiestaGenerazione:
      type: object
      additionalProperties: false
      required: [sistema_richiedente, external_context_id, modello_versione_id, dati]
      properties:
        sistema_richiedente: {type: string}
        external_context_id: {type: string}
        modello_versione_id: {type: integer, format: int64}
        data_riferimento: {type: string, format: date, nullable: true}
        dati: {type: object, additionalProperties: true}
    EsitoGenerazione:
      type: object
      additionalProperties: false
      required: [stato, messaggio, modello_versione_id, external_context_id, validazione]
      properties:
        stato: {type: string, enum: [COMPLETATO, FALLITO, DATI_NON_VALIDI]}
        messaggio: {type: string}
        modello_versione_id: {type: integer, format: int64}
        external_context_id: {type: string}
        riferimento_documentale:
          type: string
          nullable: true
          description: >
            Il riferimento della generazione nel registro, presente per ogni
            esito (dalla 0.4.0 anche per DATI_NON_VALIDI). Per COMPLETATO questo
            schema non e' il corpo effettivo della risposta (che e' il PDF
            binario): il riferimento arriva nell'header X-Riferimento-Documentale.
        validazione:
          type: object
          additionalProperties: false
          required: [valido, errori]
          properties:
            valido: {type: boolean}
            errori:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [codice, messaggio]
                properties:
                  campo: {type: string, nullable: true}
                  codice: {type: string}
                  messaggio: {type: string}
    Errore:
      type: object
      additionalProperties: false
      required: [codice, messaggio]
      properties:
        codice: {type: string}
        messaggio: {type: string}
  responses:
    Unauthorized:
      description: JWT assente o non valido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
    Forbidden:
      description: Ruolo DOCUMENTI_GENERATORE assente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
    NotFound:
      description: Versione modello inesistente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
