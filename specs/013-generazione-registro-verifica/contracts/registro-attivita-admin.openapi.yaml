openapi: 3.0.3
info:
  title: GEMODO - Registro attivita' amministrativo
  version: 0.1.0
  description: >
    API amministrativa della spec 013. Espone in un unico registro le
    generazioni, le validazioni, gli accessi negati e gli audit di modelli,
    configurazione e integrazioni. Non include la verifica PDF/dati: quella
    funzione e' rinviata a una spec futura.
servers:
  - url: /api/v1
security:
  - KeycloakBearer: []
paths:
  /admin/attivita:
    get:
      operationId: listRegistroAttivita
      summary: Elenca gli eventi del registro attivita'
      parameters:
        - {$ref: '#/components/parameters/Da'}
        - {$ref: '#/components/parameters/A'}
        - {$ref: '#/components/parameters/Categoria'}
        - {$ref: '#/components/parameters/Esito'}
        - {$ref: '#/components/parameters/Utente'}
        - {$ref: '#/components/parameters/Testo'}
        - {$ref: '#/components/parameters/Limite'}
        - {$ref: '#/components/parameters/Salto'}
      responses:
        '200':
          description: Pagina di eventi in ordine cronologico inverso
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistroAttivita'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/attivita.csv:
    get:
      operationId: exportRegistroAttivitaCsv
      summary: Esporta gli eventi filtrati in CSV
      parameters:
        - {$ref: '#/components/parameters/Da'}
        - {$ref: '#/components/parameters/A'}
        - {$ref: '#/components/parameters/Categoria'}
        - {$ref: '#/components/parameters/Esito'}
        - {$ref: '#/components/parameters/Utente'}
        - {$ref: '#/components/parameters/Testo'}
      responses:
        '200':
          description: CSV con separatore punto e virgola
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    KeycloakBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Da:
      name: da
      in: query
      description: Giorno iniziale incluso
      schema: {type: string, format: date}
    A:
      name: a
      in: query
      description: Giorno finale incluso
      schema: {type: string, format: date}
    Categoria:
      name: categoria
      in: query
      description: GENERAZIONE, VALIDAZIONE, ACCESSO, MODELLO, CONFIGURAZIONE, INTEGRAZIONE
      schema: {type: string}
    Esito:
      name: esito
      in: query
      schema: {type: string}
    Utente:
      name: utente
      in: query
      description: Username, subject del token o client id
      schema: {type: string}
    Testo:
      name: testo
      in: query
      description: Testo da cercare in oggetto, azione o dettaglio
      schema: {type: string}
    Limite:
      name: limite
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Salto:
      name: salto
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  schemas:
    RegistroAttivita:
      type: object
      additionalProperties: false
      required: [eventi, altri]
      properties:
        eventi:
          type: array
          items: {$ref: '#/components/schemas/EventoAttivita'}
        altri:
          type: boolean
          description: true se esiste almeno un'altra pagina
    EventoAttivita:
      type: object
      additionalProperties: false
      required: [quando, categoria, azione, esito, dettaglio]
      properties:
        quando: {type: string, format: date-time}
        categoria: {type: string}
        azione: {type: string}
        esito: {type: string}
        soggetto: {type: string, nullable: true}
        username: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        contesto: {type: string, nullable: true}
        oggetto_tipo: {type: string, nullable: true}
        oggetto_id: {type: string, nullable: true}
        oggetto_nome: {type: string, nullable: true}
        dettaglio: {type: object, additionalProperties: true}
    Errore:
      type: object
      additionalProperties: false
      required: [codice, messaggio]
      properties:
        codice: {type: string}
        messaggio: {type: string}
  responses:
    Unauthorized:
      description: JWT assente o non valido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
    Forbidden:
      description: Ruolo GEMODO_ADMIN assente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
