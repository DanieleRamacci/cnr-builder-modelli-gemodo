openapi: 3.0.3
info:
  title: GEMODO - Registro delle generazioni
  version: 0.2.0
  description: >
    Dalla 0.2.0 (spec 013) GEMODO non conserva i PDF: il documento si riceve
    solo dalla risposta di `POST /documenti/genera`, e il download della 0.1.0
    non c'e' piu'. Ogni chiamata a `genera` lascia una riga nel registro delle
    generazioni, con le impronte SHA-256 dei dati ricevuti e del PDF
    consegnato; la stessa chiave (sistema + external_context_id + versione del
    modello) si ripete quante volte serve. Per riferimento si legge la riga,
    solo con GEMODO_ADMIN.
servers:
  - url: /api/v1
security:
  - KeycloakBearer: []
paths:
  /documenti/{riferimento}:
    parameters:
      - {$ref: '#/components/parameters/Riferimento'}
    get:
      operationId: getStatoDocumento
      summary: Una generazione del registro, per riferimento (solo GEMODO_ADMIN)
      responses:
        '200':
          description: La riga del registro, qualunque sia l'esito
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatoDocumento'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    KeycloakBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Riferimento:
      name: riferimento
      in: path
      required: true
      schema: {type: string, minLength: 1}
  schemas:
    StatoDocumento:
      type: object
      additionalProperties: false
      required: [riferimento, stato, tipo_output, sistema_richiedente, external_context_id, nome_file, hash_dati, creato_il, creato_da, modello_versione_id]
      properties:
        riferimento: {type: string}
        stato: {type: string, enum: [COMPLETATO, FALLITO, DATI_NON_VALIDI]}
        tipo_output: {type: string, enum: [TEST]}
        sistema_richiedente: {type: string}
        external_context_id: {type: string}
        nome_file: {type: string}
        hash_dati: {type: string, description: "SHA-256 dei dati ricevuti, con le chiavi ordinate"}
        hash_file: {type: string, nullable: true, description: "SHA-256 del PDF consegnato; assente se non e' stato generato"}
        dimensione_byte: {type: integer, nullable: true}
        creato_il: {type: string, format: date-time}
        creato_da: {type: string, description: Soggetto del token che ha chiesto la generazione}
        client_id: {type: string, nullable: true}
        modello_versione_id: {type: integer, format: int64}
        errore_messaggio: {type: string, nullable: true}
    Errore:
      type: object
      additionalProperties: false
      required: [codice, messaggio]
      properties:
        codice: {type: string}
        messaggio: {type: string}
  responses:
    Unauthorized:
      description: JWT assente o non valido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
    Forbidden:
      description: Non e' un amministratore GEMODO
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
    NotFound:
      description: Riferimento inesistente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Errore'}
