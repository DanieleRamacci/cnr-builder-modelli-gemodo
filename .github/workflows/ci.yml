name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberatamente SENZA servizio postgres e senza DATABASE_URL.
  # Verificato il 2026-09-22: impostando DATABASE_URL su un'unica istanza
  # condivisa, 13 test falliscono per inquinamento incrociato fra moduli
  # (gli stessi test passano isolati su un DB pulito). La suite si regge
  # sull'isolamento per-fixture di Testcontainers, disponibile sui runner
  # GitHub. Le migration le eseguono le fixture stesse
  # (command.upgrade(Config("alembic.ini"), "head")), non un passo a parte.
  # Vedi il task aperto sull'isolamento in specs/009.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run test suite
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run test suite
        working-directory: frontend
        run: npm test

  # Il cancello che mancava: impedisce che un requisito nuovo entri senza
  # una riga di copertura, che una riga citi un file inesistente, o che una
  # riga BLOCCATA non dichiari il proprio bloccante.
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Validate coverage matrix and decision register
        working-directory: backend
        run: uv run pytest tests/integration/test_coverage_matrix.py tests/integration/test_open_decision_gates.py tests/contract/test_quality_readiness_contract.py tests/contract/test_open_decisions_contract.py -q
      - name: Every requirement of every spec has a coverage row
        run: python scripts/check-coverage-matrix.py
