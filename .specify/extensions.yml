installed:
- adev-quality
- agent-context
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  after_implement:
  - extension: adev-quality
    command: speckit.adev-quality.review
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.adev-quality.review?
    description: Run independent quality review before a feature can be considered
      complete.
    condition: null
