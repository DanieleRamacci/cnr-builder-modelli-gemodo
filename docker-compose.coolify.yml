services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: production
    environment:
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-https://sso.test.si.cnr.it/auth/realms/cnr}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-gemodo-frontend}
      # URL della pagina "docs" separata sotto, una volta che ha un proprio dominio
      # configurato su Coolify (vuoto = nessun link mostrato nel footer, vedi
      # frontend/src/app/shell/shell.component.ts).
      GEMODO_EXTERNAL_DOCS_URL: ${GEMODO_EXTERNAL_DOCS_URL:-}
    expose:
      - "80"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/
      interval: 30s
      timeout: 3s
      retries: 3

  # Pagina statica "GEMODO DEV" (discovery/documentazione auth ACE per il team
  # GEBAN esterno) - era servita dal servizio "frontend" prima che diventasse la
  # vera app Angular; spostata qui come servizio a parte cosi' non si perde.
  # Assegnare un dominio/percorso separato in Coolify (es. un sottodominio
  # dedicato), poi impostare GEMODO_EXTERNAL_DOCS_URL sopra a quell'indirizzo.
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/
      interval: 30s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-gemodo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gemodo}}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-https://sso.test.si.cnr.it/auth/realms/cnr}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-gemodo-backend}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-gemodo-frontend}
      GEMODO_ALLOWED_INTERACTIVE_CLIENTS: ${GEMODO_ALLOWED_INTERACTIVE_CLIENTS:-gemodo-frontend}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      KEYCLOAK_JWKS_CACHE_TTL_SECONDS: ${KEYCLOAK_JWKS_CACHE_TTL_SECONDS:-300}
      GEMODO_USE_MOCK_PRINCIPAL: ${GEMODO_USE_MOCK_PRINCIPAL:-false}
      DOCUMENTALE_MOCK_URL: ${DOCUMENTALE_MOCK_URL:-}
      # Discovery esterna (010): il builder legge solo integrazioni CONNESSE dal
      # registro admin, non da un URL d'ambiente. Allowlist di deployment per le
      # destinazioni che l'admin puo' configurare/verificare (vuoto di default).
      GEMODO_INTEGRAZIONI_ALLOWLIST: ${GEMODO_INTEGRAZIONI_ALLOWLIST:-}
      GEMODO_INTEGRAZIONI_ALLOWLIST_PRIVATO: ${GEMODO_INTEGRAZIONI_ALLOWLIST_PRIVATO:-}
    expose:
      - "8000"
    depends_on:
      - postgres
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemodo}
      POSTGRES_USER: ${POSTGRES_USER:-gemodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gemodo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-gemodo} -d ${POSTGRES_DB:-gemodo}"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gemodo-postgres-data:
