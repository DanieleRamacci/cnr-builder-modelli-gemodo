# Catalogo seed demo (spec 009, FR-003, FR-010, FR-011, FR-027).
#
# `seeds` elenca le entita' SeedDemo (backend/app/quality/schemas.py) usate da
# backend/app/quality/seed_demo.py per la validazione (marcatura demo obbligatoria,
# nessun dato reale o sensibile). `catalogo` contiene i dati demo veri e propri:
# tipologie/procedure bando GEBAN/SOL, profili professionali e i due modelli richiesti
# da FR-011 (uno pubblicato e utilizzabile dal mock GEBAN, uno non pubblicabile per
# verificare gli errori funzionali).
#
# Nessun valore qui rappresenta un bando, un utente o un dato reale.

seeds:
  - id: seed-tipi-documento-geban-demo
    nome: Tipo documento BANDO_CONCORSO (demo)
    tipo: CATALOGO
    marcatura_demo: DEMO
    spec_owner: specs/001-catalogo-contratto-geban
    resettable: true
    dati_sensibili: false
  - id: seed-categoria-bando-concorso-demo
    nome: Profili professionali per BANDO_CONCORSO
    tipo: CATALOGO
    marcatura_demo: DEMO
    spec_owner: specs/002-builder-modelli
    resettable: true
    dati_sensibili: false
  - id: seed-tipologie-sol-geban-demo
    nome: Tipologie/procedure bando GEBAN/SOL iniziali
    tipo: CATALOGO
    marcatura_demo: DEMO
    spec_owner: specs/001-catalogo-contratto-geban
    resettable: true
    dati_sensibili: false
  - id: seed-modello-bando-concorso-pubblicato-demo
    nome: Modello BANDO_CONCORSO standard pubblicato (demo)
    tipo: MODELLO
    marcatura_demo: DEMO
    spec_owner: specs/002-builder-modelli
    resettable: true
    dati_sensibili: false
  - id: seed-modello-bando-concorso-non-pubblicabile-demo
    nome: Modello BANDO_CONCORSO con HTML libero (demo, caso non valido)
    tipo: MODELLO
    marcatura_demo: DEMO
    spec_owner: specs/002-builder-modelli
    resettable: true
    dati_sensibili: false

catalogo:
  tipi_documento:
    - codice: BANDO_CONCORSO
      nome: Bando di concorso
      spec_owner: specs/001-catalogo-contratto-geban

  # Profili professionali GEBAN (nomenclatura confermata dal team GEBAN, 2026-09-14).
  categorie:
    - codice: RICERCATORE
      tipo_documento: BANDO_CONCORSO
      nome: Ricercatore
      spec_owner: specs/002-builder-modelli
    - codice: TECNOLOGO
      tipo_documento: BANDO_CONCORSO
      nome: Tecnologo
      spec_owner: specs/002-builder-modelli
    - codice: FUNZIONARIO_AMMINISTRAZIONE
      tipo_documento: BANDO_CONCORSO
      nome: Funzionario di Amministrazione
      spec_owner: specs/002-builder-modelli
    - codice: COLLABORATORE_TECNICO_ER
      tipo_documento: BANDO_CONCORSO
      nome: Collaboratore Tecnico E.R.
      spec_owner: specs/002-builder-modelli
    - codice: COLLABORATORE_AMMINISTRAZIONE
      tipo_documento: BANDO_CONCORSO
      nome: Collaboratore di Amministrazione
      spec_owner: specs/002-builder-modelli
    - codice: OPERATORE_TECNICO
      tipo_documento: BANDO_CONCORSO
      nome: Operatore Tecnico
      spec_owner: specs/002-builder-modelli
    - codice: OPERATORE_AMMINISTRAZIONE
      tipo_documento: BANDO_CONCORSO
      nome: Operatore di Amministrazione
      spec_owner: specs/002-builder-modelli

  classificazioni:
    - tipo_documento: BANDO_CONCORSO
      codice_tipologia: CP
      categorie: [COLLABORATORE_TECNICO_ER, OPERATORE_TECNICO, RICERCATORE, TECNOLOGO, FUNZIONARIO_AMMINISTRAZIONE]
    - tipo_documento: BANDO_CONCORSO
      codice_tipologia: TD
      categorie: [COLLABORATORE_TECNICO_ER, OPERATORE_TECNICO, RICERCATORE, TECNOLOGO]
    - tipo_documento: BANDO_CONCORSO
      codice_tipologia: TI
      categorie: [COLLABORATORE_TECNICO_ER, OPERATORE_TECNICO, RICERCATORE, TECNOLOGO, FUNZIONARIO_AMMINISTRAZIONE]
    - tipo_documento: BANDO_CONCORSO
      codice_tipologia: RS
      categorie: [RICERCATORE, TECNOLOGO]
    - tipo_documento: BANDO_CONCORSO
      codice_tipologia: MOB
      categorie: [COLLABORATORE_TECNICO_ER, OPERATORE_TECNICO, RICERCATORE, TECNOLOGO, FUNZIONARIO_AMMINISTRAZIONE]

  # Tipologie/procedure bando esposte a GEBAN (nomenclatura confermata dal team GEBAN,
  # 2026-09-14). Il codice SOL resta metadato interno: se una procedura non ha ancora
  # il folder definitivo, aggiornare solo questo file e riallineare il seed DB, senza
  # cambiare contratto API.
  tipologie_sol:
    - codice: TDPNRR
      codice_sol: "DA_CONFIGURARE_IN_SOL"
      nome: Tempo Determinato PNRR
    - codice: CD
      codice_sol: "DA_CONFIGURARE_IN_SOL"
      nome: Comandi e Distacchi
    - codice: DIR
      codice_sol: "DA_CONFIGURARE_IN_SOL"
      nome: Direttori
    - codice: TD
      codice_sol: "F:jconon_call_tdet:folder"
      nome: Tempo Determinato
    - codice: CP
      codice_sol: "F:jconon_call_tind:folder_concorsi_pubblici"
      nome: Concorsi Pubblici
    - codice: RS
      codice_sol: "DA_CONFIGURARE_IN_SOL"
      nome: Reclutamento Speciale
    - codice: CATP
      codice_sol: "DA_CONFIGURARE_IN_SOL"
      nome: Categorie Protette
    - codice: TI
      codice_sol: "F:jconon_call_tind:folder"
      nome: Tempo Indeterminato
    - codice: SDIP
      codice_sol: "DA_CONFIGURARE_IN_SOL"
      nome: Selezioni per dipendenti CNR/Candidature
    - codice: MOB
      codice_sol: "F:jconon_call_mobility:folder"
      nome: Mobilità

  modelli:
