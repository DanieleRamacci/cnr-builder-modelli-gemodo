      public_id: 1
      tipo_documento: BANDO_CONCORSO
      categoria: COLLABORATORE_TECNICO_ER
      codice_tipologia: TD
      nome: Bando tempo determinato Collaboratore Tecnico E.R. demo
      stato: PUBBLICATO
