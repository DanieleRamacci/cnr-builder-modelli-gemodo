# Profili di integrazione locali/test (spec 009, User Story 1/2; entita' SistemaRichiedente,
# ClientApplicativo, ProfiloDiIntegrazione in backend/app/quality/schemas.py).
#
# Keycloak resta la sorgente di identita', client tecnici, audience e ruoli/claim generali;
# questo manifest e' la sorgente delle autorizzazioni applicative fini GEMODO su tipi
# documento, categorie, tipologie, modelli/versioni, contratti dati e operazioni (FR-033,
# FR-034, FR-035; decisione confermata SEC-006-001, 2026-07-29).
#
# GEMODO non gestisce password o segreti: gestisce_credenziali resta sempre false.

sistemi_richiedenti:
  - codice: GEBAN
    nome: GEBAN - gestione bandi di concorso
    stato: ATTIVO
    spec_owner: specs/001-catalogo-contratto-geban
    client_applicativi:
      - client_id: geban-backend
        audience_attesa: gemodo-backend
        ruoli_claim_richiesti:
          - DOCUMENTI_GENERATORE
        sistemi_abilitati:
          - GEBAN
        stato: ATTIVO
        gestisce_credenziali: false
    profili_integrazione:
      - codice: GEBAN_RECLUTAMENTO_V1
        sistema_richiedente: GEBAN
        versione: "1"
        stato: ATTIVO
        client_ammessi:
          - geban-backend
        tipi_documento_ammessi:
          - BANDO_CONCORSO
        categorie_ammessi:
          - DEMO
        tipologie_ammessi:
          - TDPNRR
          - CD
          - DIR
          - TD
          - CP
          - RS
          - CATP
          - TI
          - SDIP
          - MOB
        modelli_versioni_ammessi:
          - demo-bando-concorso-standard-v1
        contratti_dati_ammessi:
          - bando-concorso-common-fields-v1
        permessi_operativi:
          - catalogo
          - validazione
          - generazione_bozza
          - generazione_ufficiale
          - stato
          - download

  # Sistemi richiedenti futuri (GRADUATORIE, CHECKIN) restano solo previsti dal modello
  # dati; non hanno ancora client o profilo attivo in questo ambiente locale.
