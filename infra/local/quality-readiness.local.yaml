    contract_ref: specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml
    status: DA_COPRIRE
  - spec_owner: specs/009-fondamenta-mock-test-qualita
    requirement_id: FR-012
    scenario_id: E2E-002
    contract_ref: specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml
    status: DA_COPRIRE
  - spec_owner: specs/009-fondamenta-mock-test-qualita
    requirement_id: FR-013
    scenario_id: E2E-003
    contract_ref: specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml
    status: DA_COPRIRE
  - spec_owner: specs/009-fondamenta-mock-test-qualita
    requirement_id: FR-013
    scenario_id: E2E-004
    contract_ref: specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml
    status: DA_COPRIRE
  - spec_owner: specs/009-fondamenta-mock-test-qualita
    requirement_id: FR-014
    scenario_id: E2E-005
    contract_ref: specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml
    status: DA_COPRIRE
  - spec_owner: specs/009-fondamenta-mock-test-qualita
    requirement_id: FR-035
    scenario_id: E2E-006
    contract_ref: specs/009-fondamenta-mock-test-qualita/contracts/mock-geban-scenarios.yaml
    status: DA_COPRIRE

open_decisions:
  - id: SEC-006-001
    title: Token tecnico GEBAN verso GEMODO
    owner_spec: specs/006-sicurezza-autorizzazioni-audit
    impacted_specs:
      - specs/005-storage-idempotenza-consultazione
      - specs/009-fondamenta-mock-test-qualita
    status: CONFERMATA
    provisional_assumption: >
      token tecnico Keycloak (client credentials) geban-backend con ruolo
      DOCUMENTI_GENERATORE; utente reale e contesto GEBAN nel payload solo per audit,
      risolta 2026-07-29
    blocking_phase: NESSUNA
  - id: SEC-006-002
    title: Separazione revisore/approvatore builder modelli
    owner_spec: specs/006-sicurezza-autorizzazioni-audit
    impacted_specs:
      - specs/002-builder-modelli
      - specs/009-fondamenta-mock-test-qualita
    status: CONFERMATA
    provisional_assumption: >
      flusso minimo senza separazione obbligatoria, GEMODO_MODELLI_GESTORE abilitato
      anche alla pubblicazione vale come approvazione; ruoli revisore/approvatore
      riservati e inattivi, risolta 2026-07-29
    blocking_phase: NESSUNA
  - id: DEC-009-NOME-SERVIZIO
    title: Nome definitivo del servizio
    owner_spec: specs/009-fondamenta-mock-test-qualita
    impacted_specs:
      - specs/009-fondamenta-mock-test-qualita
    status: ASSUNTA_PROVVISORIA
    provisional_assumption: "GEMODO, usato in documentazione e naming pubblico"
    blocking_phase: NESSUNA
  - id: DEC-001-PROFILO-GEBAN
    title: Profilo GEBAN versionato e mappatura campi concordata
    owner_spec: specs/001-catalogo-contratto-geban
    impacted_specs:
      - specs/002-builder-modelli
      - specs/003-sezioni-placeholder-versionamento
      - specs/004-generazione-documenti-pdf
      - specs/006-sicurezza-autorizzazioni-audit
      - specs/009-fondamenta-mock-test-qualita
    status: ASSUNTA_PROVVISORIA
    provisional_assumption: >
      gestione ibrida: profilo GEBAN versionato in GEMODO che associa categorie,
      sottocategorie, modelli richiamabili e placeholder/campi gia' concordati; le API
      restano disponibili per esporre catalogo e campi richiesti
    blocking_phase: TASKS
