server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS: resolves `backend` at request time instead of once at
  # nginx startup. Without this, `proxy_pass http://backend:8000` (a static
  # hostname) fails DNS resolution once when nginx loads its config and refuses
  # to start at all if `backend` is not yet up/resolvable - a real startup-order
  # crash found while verifying this file, not a theoretical concern.
  resolver 127.0.0.11 valid=10s;
  set $backend_upstream http://backend:8000;

  # Never cache index.html (SPA entry point) or runtime-config.json (regenerated
  # per deploy from container env vars - see docker-entrypoint.sh); everything
  # else Angular already content-hashes, so it is safe to cache long-lived.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /runtime-config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /redoc {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
