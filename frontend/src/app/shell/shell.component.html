<header class="app-header">
  <div class="app-header-row">
    <a routerLink="/" class="brand-link" aria-label="Home Modellario">
      <span class="brand-mark">M</span>
      <span>Modellario</span>
    </a>
    <nav class="app-nav" aria-label="Navigazione principale">
      @if (isManager || isAdmin) {
        <a routerLink="/contesti" routerLinkActive="active" class="nav-link">Contesti</a>
      }
      @if (isManager) {
        <a routerLink="/contesti" routerLinkActive="active" class="nav-link">Modelli</a>
      }
      @if (isAdmin) {
        <a routerLink="/configurazione" routerLinkActive="active" class="nav-link">Impostazioni</a>
      }
    </nav>
    <a routerLink="/profilo" class="user-link" title="Profilo utente">
      <span class="user-name">{{ userName }}</span>
      <span class="avatar">{{ userInitials || 'U' }}</span>
    </a>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="app-footer-row">
    Modellario - CNR
    @if (externalDocsUrl) {
      <a [href]="externalDocsUrl" target="_blank" rel="noopener" class="ms-3">Documentazione</a>
    }
  </div>
</footer>
