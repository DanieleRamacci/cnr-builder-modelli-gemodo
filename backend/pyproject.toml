[project]
name = "gemodo-backend"
version = "0.1.0"
description = "GEMODO - Servizio Gestione Modelli e Generazione Documenti (backend)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "DA_CONFERMARE" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx2>=2.9",
]

[project.scripts]
gemodo-quality = "app.quality.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
