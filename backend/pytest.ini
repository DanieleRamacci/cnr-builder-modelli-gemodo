[pytest]
testpaths = tests
pythonpath = .
markers =
    contract: verifica un manifest o payload contro un contratto versionato (specs/*/contracts/*.yaml)
    integration: verifica il comportamento di un servizio/componente backend senza dipendere da GEBAN reale
    e2e: verifica uno scenario end-to-end del mock GEBAN dal catalogo allo stato/download
filterwarnings =
    error
