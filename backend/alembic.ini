[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally not set here: app/db and alembic/env.py read the
# connection string from the DATABASE_URL environment variable (see
# infra/local/compose.yaml and backend/alembic/README.md), never hardcoded.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
